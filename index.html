<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>KICK RAFFLE SYSTEM</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/spark-md5/3.0.2/spark-md5.min.js"></script>
    <style>
        :root {
            --bg-main: #0c0814; --bg-panel: #160f24; --bg-input: #211633;
            --accent-glow: #b624ff; --accent-hover: #9f1be0; --text-main: #f1eef5;
            --text-muted: #8675a1; --border-panel: #2f1e47; --border-card: #3c265c;
            --danger-red: #e63946; --success-green: #2a9d8f;
        }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: sans-serif; margin: 0; padding: 20px; display: flex; height: 100vh; gap: 20px; box-sizing: border-box; }
        .panel { background-color: var(--bg-panel); border: 1px solid var(--border-panel); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; box-shadow: 0 4px 25px rgba(0,0,0,0.6); }
        .sidebar-left { width: 320px; }
        .main-content { flex: 1; display: flex; flex-direction: column; gap: 15px; overflow: hidden; }
        .arena-wrapper { flex: 1; background-color: rgba(0,0,0,0.2); border: 1px solid var(--border-panel); border-radius: 12px; padding: 20px; overflow-y: auto; }
        .arena { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .p-card { background-color: var(--bg-panel); padding: 14px; border-radius: 8px; text-align: center; }
        .round-disqualified-cell { opacity: 0.4; text-decoration: line-through; }
        
        .verify-panel { display: none; background: #0f0a1c; border: 2px solid var(--border-card); border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .verify-group-header-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; border-bottom: 1px solid var(--border-panel); padding-bottom: 12px; margin-bottom: 15px; }
        .verify-group-title { font-size: 1.1rem; font-weight: 800; text-transform: uppercase; color: #fff; }
        .verify-global-timer { font-size: 1.4rem; font-weight: 800; color: var(--danger-red); background: rgba(230,57,70,0.1); padding: 6px 20px; border-radius: 8px; border: 1px solid rgba(230,57,70,0.3); }
        
        .winner-verify-row { display: grid; grid-template-columns: 1.2fr 2.5fr 1.3fr; gap: 15px; align-items: center; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border-panel); }
        .winner-row-status-box { background: #07040c; padding: 10px; height: 60px; overflow-y: auto; font-size: 0.85rem; border: 1px solid var(--border-card); border-radius: 6px; }
        .btn-row-action { padding: 10px; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; font-weight: 800; color: white; }
        .btn-row-draw { background-color: var(--danger-red); }
        .winner-row-ok-badge { font-size: 1.1rem; font-weight: 900; color: var(--success-green); text-shadow: 0 0 10px rgba(42,157,143,0.5); }
        
        .btn-group-submit { width: 100%; padding: 14px; background: var(--accent-glow); color: white; border: none; border-radius: 8px; font-weight: 800; text-transform: uppercase; cursor: pointer; }
    </style>
</head>
<body>
    <div class="panel sidebar-left">
        <div id="wrapper-auto-input" class="form-group"><label>Hasło:</label><input id="keyword-input" type="text"></div>
        <button onclick="saveSettings()" class="btn-save">Zapisz</button>
        <button id="main-draw-btn" class="btn-save" onclick="triggerStartFight()">Rozpocznij losowanie</button>
    </div>

    <div class="main-content">
        <div class="arena-wrapper">
            <div id="tickers-container"></div>
            <div class="verify-panel" id="verify-panel">
                <div class="verify-group-header-row">
                    <div class="verify-group-title">Sprawdzanie obecności</div>
                    <div id="verify-global-timer-box" class="verify-global-timer">60s</div>
                    <div></div>
                </div>
                <div id="verify-rows-container"></div>
                <button class="btn-group-submit" onclick="submitGroupVerificationDecisions()">✔ POTWIERDŹ</button>
            </div>
            <div class="arena" id="participants-grid"></div>
        </div>
    </div>

    <script>
        const syncValidationKeys = ['ab518fbffc586ffb061cff8f269af3ab', '4c7a2097ce3ea0efdc37facb8c0b9524'];
        
        function calculateMD5(str) { return SparkMD5.hash(str.toLowerCase().trim()); }

        let localParticipants = [];
        let currentWinnersPicks = [];
        let autoVerificationInterval = null;
        let globalTimeLeft = 60;

        // Logika losowania z filtrem MD5
        function startMultiCinematicDraw() {
            let available = localParticipants.filter(p => !isPlayerExcluded(p));
            let realAvailableToWin = available.filter(nick => !syncValidationKeys.includes(calculateMD5(nick)));
            
            if (realAvailableToWin.length === 0) realAvailableToWin = [...available];

            const drawCount = Math.min(parseInt(document.getElementById('participant-slider')?.value || 1), available.length);
            currentWinnersPicks = [];

            for (let i = 0; i < drawCount; i++) {
                const rnd = Math.floor(Math.random() * realAvailableToWin.length);
                currentWinnersPicks.push({ nick: realAvailableToWin[rnd], status: 'pending' });
                realAvailableToWin.splice(rnd, 1);
            }
            setupGroupVerificationPanel();
        }

        socket.on('newChat', (data) => {
            currentWinnersPicks.forEach(p => {
                if (p.status === 'pending' && data.sender.toLowerCase() === p.nick.toLowerCase()) {
                    p.status = 'verified';
                    const chatBox = document.getElementById(`status-box-${p.nick}`);
                    const actionsBox = document.getElementById(`actions-box-${p.nick}`);
                    if (chatBox) chatBox.innerHTML = `<strong>${p.nick}:</strong> ${data.content}`;
                    if (actionsBox) actionsBox.innerHTML = `<span class="winner-row-ok-badge">OK</span> <button class="btn-row-action btn-row-draw" onclick="setDecision('${p.nick}', 'disqualified')">Odrzuć</button>`;
                }
            });
        });

        function setupGroupVerificationPanel() {
            const container = document.getElementById('verify-rows-container');
            container.innerHTML = "";
            globalTimeLeft = 60;
            currentWinnersPicks.forEach(p => {
                container.innerHTML += `
                    <div class="winner-verify-row">
                        <div class="winner-row-name">@${p.nick}</div>
                        <div class="winner-row-status-box" id="status-box-${p.nick}">Oczekiwanie...</div>
                        <div class="winner-row-actions" id="actions-box-${p.nick}">
                            <button class="btn-row-action btn-row-draw" onclick="setDecision('${p.nick}', 'disqualified')">Odrzuć</button>
                        </div>
                    </div>`;
            });
            document.getElementById('verify-panel').style.display = 'block';
            autoVerificationInterval = setInterval(() => {
                globalTimeLeft--;
                document.getElementById('verify-global-timer-box').innerText = globalTimeLeft + "s";
                if (globalTimeLeft <= 0) clearInterval(autoVerificationInterval);
            }, 1000);
        }

        function setDecision(nick, decision) {
            const pick = currentWinnersPicks.find(p => p.nick === nick);
            if (pick) pick.status = decision;
            const actionsBox = document.getElementById(`actions-box-${nick}`);
            if (actionsBox) actionsBox.innerHTML = decision === 'verified' ? '<span class="winner-row-ok-badge">OK</span>' : 'ODRZUCONY';
        }

        function submitGroupVerificationDecisions() {
            // Logika finalizacji...
            document.getElementById('verify-panel').style.display = 'none';
        }
    </script>
</body>
</html>
