<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>KICK RAFFLE SYSTEM</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #151719; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; padding: 20px; box-sizing: border-box; }
        .panel { background: #1c1f21; border-radius: 12px; padding: 20px; border: 1px solid #333; }
        
        /* Lewy panel (Ustawienia) */
        .sidebar { width: 300px; display: flex; flex-direction: column; gap: 15px; }
        
        /* Środkowy panel (Główny) */
        .main { flex: 1; margin: 0 20px; display: flex; flex-direction: column; gap: 20px; }
        .stats-bar { display: flex; justify-content: space-around; background: #23272a; padding: 15px; border-radius: 8px; }
        .raffle-area { flex: 1; background: #151719; border: 1px solid #333; border-radius: 8px; overflow-y: auto; padding: 10px; }
        
        /* Prawy panel (Zwycięzcy) */
        .winners { width: 250px; display: flex; flex-direction: column; }
        
        input { background: #23272a; border: 1px solid #444; color: white; padding: 10px; border-radius: 5px; }
        button { background: #00ff00; color: black; border: none; padding: 12px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="panel sidebar">
        <h3 style="color: #00ff00;">KICK RAFFLE SYSTEM</h3>
        <input id="keyword" placeholder="Słowo kluczowe">
        <button onclick="updateKeyword()">ZAPISZ HASŁO</button>
        <button onclick="reset()" style="background: #ff4444;">RESET LISTY</button>
    </div>

    <div class="main">
        <div class="stats-bar">
            <div>LOSOWANIE: <span id="status">Czekam...</span></div>
            <div>HASŁO: <span id="current-pass">-</span></div>
            <div>UCZESTNICY: <span id="count">0</span></div>
        </div>
        <div class="raffle-area" id="participants-list"></div>
    </div>

    <div class="panel winners">
        <h3>Zwycięzcy</h3>
        <div id="winners-list"></div>
    </div>

    <script>
        const socket = io();
        socket.on('init', (data) => {
            document.getElementById('current-pass').innerText = data.keyword;
            document.getElementById('count').innerText = data.participants.length;
            data.participants.forEach(p => addToList(p));
        });

        socket.on('newParticipant', (sender) => {
            addToList(sender);
            updateCount();
        });

        function addToList(sender) {
            const div = document.createElement('div');
            div.innerText = sender;
            document.getElementById('participants-list').appendChild(div);
        }

        function updateCount() {
            const count = document.getElementById('participants-list').children.length;
            document.getElementById('count').innerText = count;
        }

        function updateKeyword() {
            const kw = document.getElementById('keyword').value;
            socket.emit('updateKeyword', kw);
            document.getElementById('current-pass').innerText = kw;
        }

        function reset() {
            socket.emit('reset');
            document.getElementById('participants-list').innerHTML = "";
            updateCount();
        }
    </script>
</body>
</html>
