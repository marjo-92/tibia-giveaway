<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>KICK RAFFLE SYSTEM</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #1a1b1e; color: white; font-family: sans-serif; display: grid; grid-template-columns: 350px 1fr 300px; gap: 20px; padding: 20px; height: 100vh; }
        .panel { background: #23272a; padding: 20px; border-radius: 10px; border: 1px solid #333; }
        .chat-area { background: #151719; height: 400px; border-radius: 5px; overflow-y: auto; padding: 10px; border: 1px solid #333; }
        input, button { width: 100%; margin-top: 10px; padding: 10px; border-radius: 5px; border: none; }
        button { background: #00ff00; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="panel">
        <h2>KICK RAFFLE SYSTEM</h2>
        <input id="keyword" placeholder="Słowo kluczowe (np. a)">
        <button onclick="updateKeyword()">ZAPISZ HASŁO</button>
        <button onclick="reset()" style="background: red;">RESET LISTY</button>
    </div>

    <div class="panel">
        <div id="stats">Uczestników: 0</div>
        <div class="chat-area" id="participants-list"></div>
    </div>

    <div class="panel">
        <h3>Zwycięzcy</h3>
        <div id="winners"></div>
    </div>

    <script>
        const socket = io();
        const list = document.getElementById('participants-list');
        const stats = document.getElementById('stats');

        // Odbieranie inicjalizacji
        socket.on('init', (data) => {
            document.getElementById('keyword').value = data.keyword;
            data.participants.forEach(p => addParticipant(p));
        });

        // Odbieranie nowego uczestnika
        socket.on('newParticipant', (sender) => {
            addParticipant(sender);
        });

        function addParticipant(sender) {
            if (!document.getElementById('p-' + sender)) {
                const div = document.createElement('div');
                div.id = 'p-' + sender;
                div.innerText = sender;
                list.appendChild(div);
                stats.innerText = "Uczestników: " + list.children.length;
            }
        }

        function updateKeyword() {
            const kw = document.getElementById('keyword').value;
            socket.emit('updateKeyword', kw);
        }

        function reset() {
            socket.emit('reset');
            list.innerHTML = "";
            stats.innerText = "Uczestników: 0";
        }
    </script>
</body>
</html>
