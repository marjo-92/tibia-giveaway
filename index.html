<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>KICK RAFFLE SYSTEM</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div class="navbar">
        <div class="brand">Kick Raffle System</div>
    </div>

    <div class="app-container">
        
        <div class="panel sidebar">
            <div class="tabs">
                <div class="tab active">RAFFLE</div>
                <div class="tab">KOŁO</div>
            </div>
            <div class="section-title">Ustawienia</div>
            
            <div class="form-group">
                <label>Słowo kluczowe (opcjonalne):</label>
                <input id="keyword-input" placeholder="Wpisz hasło i kliknij zapisz">
            </div>
            <button class="btn-secondary" onclick="saveKeyword()" style="margin-bottom: 15px;">ZAPISZ HASŁO</button>
            
            <div class="form-group">
                <label>Liczba zwycięzców:</label>
                <input type="number" value="1" min="1">
            </div>
            <div class="form-group">
                <label>Czas trwania animacji (sekundy):</label>
                <input type="range" min="1" max="30" value="8">
            </div>

            <button class="btn-primary" onclick="triggerStartFight()">Rozpocznij losowanie</button>
        </div>

        <div class="main-content">
            <div class="widgets-grid">
                <div class="widget">
                    <div class="widget-icon">🎁</div>
                    <div class="widget-info">
                        <span class="widget-label">Losowanie</span>
                        <span class="widget-value" id="status-display">-</span>
                    </div>
                </div>
                <div class="widget">
                    <div class="widget-icon">🔑</div>
                    <div class="widget-info">
                        <span class="widget-label">Hasło</span>
                        <span class="widget-value" id="password-display">BRAK HASŁA</span>
                    </div>
                </div>
                <div class="widget">
                    <div class="widget-icon">👥</div>
                    <div class="widget-info">
                        <span class="widget-label">Uczestników</span>
                        <span class="widget-value" id="count-display">0</span>
                    </div>
                </div>
            </div>

            <div class="arena" id="participants-grid"></div>

            <div class="bottom-actions">
                <button class="btn-secondary">Wylosuj zwycięzcę</button>
                <button class="btn-secondary">Przemieszaj</button>
                <button class="btn-secondary btn-danger" onclick="triggerReset()">Resetuj</button>
            </div>
        </div>

        <div class="panel winners-sidebar">
            <div class="winners-header">
                <div class="section-title" style="margin:0;">Zwycięzcy</div>
                <span class="badge" id="winners-count">0</span>
            </div>
            <div class="winners-list" id="winners-box"></div>
            <button class="btn-secondary btn-danger" style="margin-top:15px;" onclick="triggerReset()">Wyczyść wszystkie dane</button>
        </div>

    </div>

    <script>
        const socket = io();
        const grid = document.getElementById('participants-grid');
        const countDisplay = document.getElementById('count-display');
        const passwordDisplay = document.getElementById('password-display');

        // Obsługa inicjalizacji
        socket.on('init', (data) => {
            grid.innerHTML = "";
            passwordDisplay.innerText = data.keyword ? data.keyword.toUpperCase() : "BRAK HASŁA";
            document.getElementById('keyword-input').value = data.keyword;
            data.participants.forEach(p => renderParticipant(p));
            updateCounter();
        });

        // Nasłuchiwanie na nowego uczestnika (Twoje sprawdzone wydarzenie)
        socket.on('newParticipant', (sender) => {
            renderParticipant(sender);
            updateCounter();
        });

        // Nasłuchiwanie na zmianę hasła ze strony serwera
        socket.on('keywordChanged', (kw) => {
            passwordDisplay.innerText = kw ? kw.toUpperCase() : "BRAK HASŁA";
        });

        // Nasłuchiwanie na reset
        socket.on('participantsReset', () => {
            grid.innerHTML = "";
            updateCounter();
        });

        function renderParticipant(sender) {
            if (!document.getElementById('p-' + sender)) {
                const div = document.createElement('div');
                div.className = 'p-card';
                div.id = 'p-' + sender;
                div.innerText = sender;
                grid.appendChild(div);
            }
        }

        function updateCounter() {
            countDisplay.innerText = grid.children.length;
        }

        function saveKeyword() {
            const val = document.getElementById('keyword-input').value;
            socket.emit('updateKeyword', val);
        }

        function triggerReset() {
            socket.emit('reset');
        }

        function triggerStartFight() {
            socket.emit('startFight');
        }
    </script>
</body>
</html>
