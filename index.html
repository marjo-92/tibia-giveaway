<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kick Tibia Raffle System</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #2a2a2a; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input, button { padding: 10px; margin: 10px; border-radius: 4px; border: none; font-size: 16px; }
        input { width: 70%; background: #333; color: #fff; border: 1px solid #555; }
        button { background: #53fc18; color: #000; font-weight: bold; cursor: pointer; }
        button:hover { background: #42c912; }
        .status { color: #aaa; margin: 10px 0; }
        .winner { font-size: 24px; color: #53fc18; font-weight: bold; margin-top: 20px; }
        ul { list-style: none; padding: 0; max-height: 150px; overflow-y: auto; background: #333; border-radius: 4px; }
        li { padding: 5px; border-bottom: 1px solid #444; }
    </style>
</head>
<body>

<div class="container">
    <h1>KICK RAFFLE SYSTEM</h1>
    <p>Wpisz nazwę kanału Kick oraz hasło do losowania</p>
    
    <input type="text" id="channelInput" placeholder="Nazwa kanału (np. sedron)">
    <input type="text" id="keywordInput" placeholder="Hasło (opcjonalnie, np. !los)">
    <br>
    <button id="connectBtn" onclick="startCollecting()">Start Collecting</button>
    <button id="drawBtn" onclick="drawWinner()" style="background: #ffaa00;" disabled>Wylosuj zwycięzcę</button>

    <div class="status" id="statusText">Status: Rozłączony</div>
    
    <h3>Uczestnicy (<span id="count">0</span>):</h3>
    <ul id="participantList"></ul>

    <div class="winner" id="winnerBox"></div>
</div>

<script>
    let participants = new Set(); // Set zapobiega duplikatom (jeden widz = jeden bilet)
    let ws = null;

    function startCollecting() {
        const channelName = document.getElementById('channelInput').value.trim().toLowerCase();
        const keyword = document.getElementById('keywordInput').value.trim();
        const statusText = document.getElementById('statusText');
        
        if (!channelName) return alert('Wpisz nazwę kanału!');

        statusText.innerText = `Łączenie z czatem ${channelName}...`;
        
        // Łączenie z publicznym, nieoficjalnym i darmowym WebSocketem czatu Kick (przez Pusher)
        // Uwaga: Kick używa sieci Pusher o kluczu: eb1d2f231ac400451a24
        if(ws) ws.close();
        
        ws = new WebSocket("wss://://pusher.com");

        ws.onopen = () => {
            statusText.innerText = `Połączono! Pobieranie ID pokoju...`;
            
            // Pobieramy ID kanału z publicznego API Kick, aby móc subskrybować czat
            fetch(`https://kick.com{channelName}`)
                .then(res => res.json())
                .then(data => {
                    const chatRoomId = data.chatroom.id;
                    
                    // Subskrybujemy kanał czatu na żywo
                    const subscribeMessage = {
                        event: "pusher:subscribe",
                        data: { channel: `chatrooms.${chatRoomId}.v2` }
                    };
                    ws.send(JSON.stringify(subscribeMessage));
                    statusText.innerText = `System aktywny. Nasłuchiwanie czatu na kanale: ${channelName}`;
                    document.getElementById('drawBtn').disabled = false;
                })
                .catch(err => {
                    statusText.innerText = "Błąd pobierania danych kanału. Upewnij się, że nazwa jest poprawna.";
                    console.error(err);
                });
        };

        ws.onmessage = (event) => {
            const response = JSON.parse(event.data);
            
            // Sprawdzamy czy to nowa wiadomość na czacie
            if (response.event === "App\\Events\\ChatMessageEvent") {
                const messageData = JSON.parse(response.data);
                const username = messageData.sender.username;
                const messageText = messageData.content;

                // Sprawdzamy warunek hasła
                if (!keyword || messageText.toLowerCase().includes(keyword.toLowerCase())) {
                    if (!participants.has(username)) {
                        participants.add(username);
                        updateUI();
                    }
                }
            }
        };

        ws.onclose = () => {
            statusText.innerText = "Status: Rozłączony";
            document.getElementById('drawBtn').disabled = true;
        };
    }

    function updateUI() {
        document.getElementById('count').innerText = participants.size;
        const list = document.getElementById('participantList');
        list.innerHTML = "";
        participants.forEach(user => {
            const li = document.createElement('li');
            li.innerText = user;
            list.appendChild(li);
        });
    }

    function drawWinner() {
        if (participants.size === 0) return alert('Brak uczestników do wylosowania!');
        
        const arr = Array.from(participants);
        const randomIndex = Math.floor(Math.random() * arr.length);
        const winner = arr[randomIndex];
        
        document.getElementById('winnerBox').innerText = `🎉 Zwycięzca: ${winner} 🎉`;
    }
</script>

</body>
</html>
