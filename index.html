<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Tibia Kick Raffle System</title>
    <style>
        body { background-color: #0b0e14; color: #d1d5db; font-family: sans-serif; margin: 0; padding: 0; user-select: none; }
        #topBar { background-color: #111622; border-bottom: 1px solid #1f2937; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .brand { color: #00e701; font-weight: bold; font-size: 18px; }
        .badge { background: #00e701; color: black; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 5px; font-weight: bold; }
        #dashboardLayout { display: flex; height: calc(100vh - 60px); }
        #leftPanel, #rightPanel { width: 300px; background-color: #111622; padding: 20px; box-sizing: border-box; border-right: 1px solid #1f2937; }
        #rightPanel { border-right: none; border-left: 1px solid #1f2937; display: flex; flex-direction: column; }
        #centerPanel { flex: 1; background-color: #090c14; padding: 25px; display: flex; flex-direction: column; }
        .panel-section h3 { color: white; font-size: 16px; margin-top: 0; margin-bottom: 20px; border-bottom: 1px solid #1f2937; padding-bottom: 10px; }
        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
        .input-group label { font-size: 11px; color: #9ca3af; font-weight: bold; text-transform: uppercase; }
        .input-group input, .input-group select { background: #1f2937; color: white; border: 1px solid #374151; padding: 10px; font-size: 14px; border-radius: 6px; width: 100%; box-sizing: border-box; }
        button.btn-green { background-color: #00e701; color: black; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-bottom: 10px; }
        button.btn-red { background-color: #ff3333; color: white; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; }
        button.btn-clear { background-color: #27272a; color: #f4f4f5; border: 1px solid #3f3f46; padding: 10px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: auto; width: 100%; }
        #statsSummary { display: flex; gap: 15px; margin-bottom: 15px; }
        .stat-card { background: #111622; border: 1px solid #1f2937; border-radius: 8px; padding: 15px 20px; flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 18px; font-weight: bold; color: white; }
        .stat-card .label { font-size: 10px; color: #9ca3af; font-weight: bold; }
        #statusText { font-size: 13px; color: #a1a1aa; background: #18181b; padding: 10px 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #27272a; }
        #registrationView { background-color: #111622; border: 1px solid #1f2937; border-radius: 8px; flex: 1; padding: 25px; display: flex; flex-direction: column; }
        #listTitle { color: #00e701; font-weight: bold; font-size: 14px; margin-bottom: 15px; }
        #viewerList { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; overflow-y: auto; }
        #emptyMessage { text-align: center; color: #4b5563; font-style: italic; margin-top: 50px; font-size: 14px; grid-column: 1/-1; }
        .viewer-tag { background: #1f2937; border: 1px solid #374151; padding: 8px 12px; border-radius: 6px; font-weight: bold; font-size: 13px; color: white; text-align: center; }
        #winnersList { display: flex; flex-direction: column; gap: 10px; }
        .empty-winners { color: #4b5563; font-size: 13px; font-style: italic; text-align: center; margin-top: 50px; }
        .winner-tag { background: rgba(0,231,1,0.1); border: 1px solid #00e701; color: #00e701; padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <header id="topBar">
        <div class="brand">KICK RAFFLE SYSTEM <span class="badge">LIVE CHAT</span></div>
        <div>Połączono: ililiililiililiiliilil</div>
    </header>

    <div id="dashboardLayout">
        <aside id="leftPanel">
            <div class="panel-section">
                <h3>Ustawienia</h3>
                <div class="input-group">
                    <label>Hasło na czat:</label>
                    <input type="text" id="chatCommand" value="!losowanie">
                </div>
                <div class="input-group">
                    <label>Nagroda:</label>
                    <input type="text" id="prizeText" value="250 TC">
                </div>
                <div class="input-group">
                    <label>Liczba zwycięzców:</label>
                    <select id="winnersCount">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                </div>
                <div class="button-actions">
                    <button onclick="connectAndListen()" class="btn-green">Rozpocznij zapisy</button>
                    <button onclick="startTextLottery()" class="btn-red">Wylosuj zwycięzców</button>
                </div>
            </div>
        </aside>

        <main id="centerPanel">
            <div id="statsSummary">
                <div class="stat-card"><span class="label">🎁 NAGRODA</span><span id="summaryPrize">-</span></div>
                <div class="stat-card"><span class="label">🔑 HASŁO</span><span id="summaryKeyword">-</span></div>
                <div class="stat-card"><span class="label">👥 UCZESTNIKÓW</span><span id="count">0</span></div>
            </div>
            <div id="statusText">Kliknij "Rozpocznij zapisy", aby aktywować system.</div>
            <div id="registrationView">
                <div id="listTitle">ZAPISANI UCZESTNICY:</div>
                <div id="viewerList">
                    <div id="emptyMessage">Napisz hasło na czacie, aby dołączyć...</div>
                </div>
            </div>
        </main>

        <aside id="rightPanel">
            <div class="panel-section" style="height: 100%; display: flex; flex-direction: column;">
                <h3>Zwycięzcy</h3>
                <div id="winnersList">
                    <div class="empty-winners">Czekam na losowanie...</div>
                </div>
                <button onclick="resetAllData()" class="btn-clear">Wyczyść dane</button>
            </div>
        </aside>
    </div>
    <script>
        let players = [];
        let socketInstance = null;
        const MY_CHATROOM_ID = 2791851; 

        function connectAndListen() {
            const command = document.getElementById("chatCommand").value.trim().toLowerCase();
            document.getElementById("summaryPrize").innerText = document.getElementById("prizeText").value;
            document.getElementById("summaryKeyword").innerText = command;
            document.getElementById("statusText").innerText = "Łączenie z czatem Kick...";
            
            players = [];
            document.getElementById("count").innerText = "0";
            document.getElementById("viewerList").innerHTML = '<div id="emptyMessage">Napisz hasło na czacie, aby dołączyć...</div>';
            document.getElementById("winnersList").innerHTML = '<div class="empty-winners">Czekam na losowanie...</div>';

            if (socketInstance) socketInstance.close();
            socketInstance = new WebSocket("wss://://pusher.com");

            socketInstance.onopen = function() {
                socketInstance.send(JSON.stringify({ event: "pusher:subscribe", data: { channel: `chatrooms.${MY_CHATROOM_ID}.v2` } }));
                document.getElementById("statusText").innerText = "🟢 Zapisy URUCHOMIONE! Czat działa.";
                document.getElementById("statusText").style.color = "#00e701";
            };

            socketInstance.onmessage = function(event) {
                const response = JSON.parse(event.data);
                if (response.event === "App\\Events\\ChatMessageEvent") {
                    const msgData = JSON.parse(response.data);
                    if (msgData.content.trim().toLowerCase() === command) {
                        const name = msgData.sender.username;
                        if (!players.includes(name)) {
                            players.push(name);
                            document.getElementById("count").innerText = players.length;
                            const empty = document.getElementById("emptyMessage");
                            if (empty) empty.remove();
                            document.getElementById("viewerList").innerHTML += `<div class="viewer-tag">${name}</div>`;
                        }
                    }
                }
            };
        }

        function startTextLottery() {
            if (players.length === 0) return alert("Nikt się nie zapisał!");
            const targetCount = parseInt(document.getElementById("winnersCount").value);
            let pool = [...players];
            let luckyWinners = [];
            for (let i = 0; i < Math.min(targetCount, pool.length); i++) {
                let rIdx = Math.floor(Math.random() * pool.length);
                luckyWinners.push(pool[rIdx]);
                pool.splice(rIdx, 1);
            }
            const winnersContainer = document.getElementById("winnersList");
            winnersContainer.innerHTML = "";
            luckyWinners.forEach(w => winnersContainer.innerHTML += `<div class="winner-tag">🏆 ${w}</div>`);
            document.getElementById("statusText").innerText = "🎉 Losowanie zakończone!";
        }

        function resetAllData() {
            players = [];
            if (socketInstance) socketInstance.close();
            document.getElementById("count").innerText = "0";
            document.getElementById("viewerList").innerHTML = '<div id="emptyMessage">Napisz hasło na czacie, aby dołączyć...</div>';
            document.getElementById("winnersList").innerHTML = '<div class="empty-winners">Czekam na losowanie...</div>';
            document.getElementById("statusText").innerText = "Wyczyszczono dane.";
            document.getElementById("statusText").style.color = "#a1a1aa";
        }
    </script>
</body>
</html>
