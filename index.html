<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>KICK RAFFLE SYSTEM</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-main: #0c0814;
            --bg-panel: #160f24;
            --bg-input: #211633;
            --accent-glow: #b624ff;
            --accent-hover: #9f1be0;
            --text-main: #f1eef5;
            --text-muted: #8675a1;
            --border-panel: #2f1e47;
            --border-card: #3c265c;
            --danger-red: #e63946;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            height: 100vh;
            box-sizing: border-box;
            gap: 20px;
        }

        /* WSPÓLNE STYLE DLA PANELU LEWEGO I PRAWEGO */
        .panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-panel);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6);
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 25px;
            color: var(--text-main);
            border-left: 3px solid var(--accent-glow);
            padding-left: 10px;
        }

        /* LEWA KOLUMNA - USTAWIENIA */
        .sidebar-left {
            width: 320px;
            min-width: 320px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .form-group label span {
            color: var(--accent-glow);
            float: right;
        }

        input[type="text"], input[type="number"] {
            background-color: var(--bg-input);
            border: 1px solid var(--border-card);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: var(--accent-glow);
            box-shadow: 0 0 8px rgba(182, 36, 255, 0.3);
        }

        /* Stylizacja suwaka (Slider) */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: var(--bg-input);
            height: 8px;
            border-radius: 4px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent-glow);
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 0 8px var(--accent-glow);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .btn-container-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 25px;
        }

        button {
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-save {
            background-color: var(--accent-glow);
            color: #fff;
            box-shadow: 0 0 10px rgba(182, 36, 255, 0.4);
        }
        .btn-save:hover { background-color: var(--accent-hover); }

        .btn-reset {
            background-color: var(--danger-red);
            color: #fff;
        }
        .btn-reset:hover { filter: brightness(1.2); }

        .btn-action {
            background-color: transparent;
            border: 1px solid var(--border-card);
            color: var(--text-main);
            margin-top: 10px;
        }
        .btn-action:hover { 
            border-color: var(--accent-glow); 
            background-color: rgba(182, 36, 255, 0.05);
        }

        /* ŚRODKOWA KOLUMNA - ARENA NICKÓW */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .status-header {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-panel);
            padding: 15px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }
        .status-lbl { color: var(--text-muted); text-transform: uppercase; font-size: 0.75rem; font-weight: 700;}
        .status-val { font-weight: 700; color: var(--accent-glow); }

        .arena-wrapper {
            flex: 1;
            background-color: rgba(0,0,0,0.2);
            border: 1px solid var(--border-panel);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .arena-title {
            text-align: center;
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .arena {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            grid-auto-rows: max-content;
            gap: 12px;
        }

        /* Wyśrodkowane nicki w ramkach */
        .p-card {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-card);
            padding: 14px 10px;
            border-radius: 8px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            word-break: break-all;
            transition: all 0.2s;
        }

        /* PRAWA KOLUMNA - TABELA ZWYCIĘZCÓW */
        .sidebar-right {
            width: 320px;
            min-width: 320px;
        }

        .table-container {
            flex: 1;
            overflow-y: auto;
            background-color: var(--bg-input);
            border-radius: 8px;
            border: 1px solid var(--border-card);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: rgba(0,0,0,0.3);
            color: var(--text-muted);
            padding: 12px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            border-bottom: 1px solid var(--border-card);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-weight: 600;
        }

        tr:last-child td { border: none; }
        
        .td-tc {
            text-align: right;
            color: var(--accent-glow);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="panel sidebar-left">
        <div class="panel-title">Ustawienia Losowania</div>
        
        <div class="form-group">
            <label>Słowo kluczowe:</label>
            <input id="keyword-input" type="text" placeholder="Wpisz hasło...">
        </div>

        <div class="form-group">
            <label>Ilość TC:</label>
            <input id="tc-input" type="number" value="50" placeholder="np. 50">
        </div>

        <div class="form-group">
            <label>Ilość uczestników: <span id="slider-val">10</span></label>
            <input id="participant-slider" type="range" min="1" max="100" value="10" oninput="document.getElementById('slider-val').innerText = this.value">
        </div>

        <div class="btn-container-row">
            <button class="btn-save" onclick="saveKeyword()">Zapisz</button>
            <button class="btn-reset" onclick="triggerReset()">Reset</button>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-card); margin-bottom: 25px; width: 100%;">

        <button class="btn-save" style="width: 100%; padding: 15px; font-size: 0.9rem;" onclick="triggerStartFight()">Rozpocznij losowanie</button>
        <button class="btn-action" style="width: 100%;" onclick="drawWinner()">Wylosuj zwycięzcę</button>
        <button class="btn-action" style="width: 100%;" onclick="shuffleParticipants()">Przemieszaj</button>
    </div>

    <div class="main-content">
        <div class="status-header">
            <div><span class="status-lbl">Status:</span> <span id="status-display" class="status-val" style="color: #fff;">Oczekiwanie</span></div>
            <div><span class="status-lbl">Aktywne Hasło:</span> <span id="password-display" class="status-val">-</span></div>
            <div><span class="status-lbl">Dołączyło:</span> <span id="count-display" class="status-val">0</span></div>
        </div>

        <div class="arena-wrapper">
            <div class="arena-title">arena</div>
            <div class="arena" id="participants-grid"></div>
        </div>
    </div>

    <div class="panel sidebar-right">
        <div class="panel-title">Zwycięzcy</div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Nick</th>
                        <th style="text-align: right;">Nagroda</th>
                    </tr>
                </thead>
                <tbody id="winners-table-body">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        const socket = io();
        let localParticipants = [];
        let winnersList = [];

        const grid = document.getElementById('participants-grid');
        const countDisplay = document.getElementById('count-display');
        const passwordDisplay = document.getElementById('password-display');
        const statusDisplay = document.getElementById('status-display');
        const winnersTableBody = document.getElementById('winners-table-body');
        const keywordInput = document.getElementById('keyword-input');
        const tcInput = document.getElementById('tc-input');
        const participantSlider = document.getElementById('participant-slider');

        socket.on('init', (data) => {
            grid.innerHTML = "";
            localParticipants = data.participants || [];
            passwordDisplay.innerText = data.keyword ? data.keyword.toUpperCase() : "A";
            keywordInput.value = data.keyword || "a";
            localParticipants.forEach(p => renderParticipant(p));
            updateCounter();
        });

        socket.on('newParticipant', (sender) => {
            if (!localParticipants.includes(sender)) {
                localParticipants.push(sender);
                renderParticipant(sender);
                updateCounter();
            }
        });

        socket.on('keywordChanged', (kw) => {
            passwordDisplay.innerText = kw ? kw.toUpperCase() : "BRAK HASŁA";
            statusDisplay.innerText = "Hasło zaktualizowane";
        });

        socket.on('participantsReset', () => {
            grid.innerHTML = "";
            winnersTableBody.innerHTML = "";
            localParticipants = [];
            winnersList = [];
            statusDisplay.innerText = "Zresetowano system";
            updateCounter();
        });

        socket.on('triggerFight', () => {
            const requiredAmount = parseInt(participantSlider.value);
            
            if (localParticipants.length < requiredAmount) {
                statusDisplay.innerText = `Za mało osób! Wymagane: ${requiredAmount}`;
                return;
            }
            
            statusDisplay.innerText = "Trwa losowanie...";
            
            let shuffles = 0;
            const interval = setInterval(() => {
                shuffleParticipants();
                shuffles++;
                if (shuffles >= 10) {
                    clearInterval(interval);
                    drawWinner();
                }
            }, 150);
        });

        function renderParticipant(sender) {
            if (!document.getElementById('p-' + sender)) {
                const div = document.createElement('div');
                div.className = 'p-card';
                div.id = 'p-' + sender;
                div.innerText = sender;
                grid.appendChild(div);
            }
        }

        function updateCounter() {
            countDisplay.innerText = localParticipants.length;
        }

        function saveKeyword() {
            const val = keywordInput.value;
            socket.emit('updateKeyword', val);
        }

        function triggerReset() {
            socket.emit('reset');
        }

        function triggerStartFight() {
            socket.emit('startFight');
        }

        function shuffleParticipants() {
            if (localParticipants.length < 2) return;
            
            for (let i = localParticipants.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [localParticipants[i], localParticipants[j]] = [localParticipants[j], localParticipants[i]];
            }
            
            grid.innerHTML = "";
            localParticipants.forEach(p => {
                renderParticipant(p);
                if (winnersList.includes(p)) {
                    const card = document.getElementById('p-' + p);
                    if (card) {
                        card.style.borderColor = 'var(--accent-glow)';
                        card.style.backgroundColor = 'rgba(182, 36, 255, 0.15)';
                        card.style.color = 'var(--accent-glow)';
                        card.style.boxShadow = '0 0 12px rgba(182, 36, 255, 0.4)';
                    }
                }
            });
        }

        function drawWinner() {
            const available = localParticipants.filter(p => !winnersList.includes(p));
            
            if (available.length === 0) {
                statusDisplay.innerText = "Brak wolnych uczestników!";
                return;
            }

            const randomIndex = Math.floor(Math.random() * available.length);
            const winner = available[randomIndex];
            
            winnersList.push(winner);
            const tcValue = tcInput.value || "0";

            // Dodanie wiersza (Tylko Nick i Nagroda - bez kolumny miejsca)
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${winner}</td>
                <td class="td-tc">${tcValue} TC</td>
            `;
            winnersTableBody.appendChild(tr);

            // Podświetlenie neonowym fioletem na arenie
            const card = document.getElementById('p-' + winner);
            if (card) {
                card.style.borderColor = 'var(--accent-glow)';
                card.style.backgroundColor = 'rgba(182, 36, 255, 0.2)';
                card.style.color = 'var(--accent-glow)';
                card.style.boxShadow = '0 0 15px rgba(182, 36, 255, 0.6)';
            }

            statusDisplay.innerText = `Wygrywa: ${winner}!`;
        }
    </script>
</body>
</html>
