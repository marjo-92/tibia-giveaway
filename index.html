<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>KICK RAFFLE SYSTEM</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="panel sidebar">
        <h3>USTAWIENIA</h3>
        <input id="keyword" placeholder="Hasło">
        <button onclick="updateKeyword()">ZAPISZ HASŁO</button>
        <button onclick="reset()" style="border-color: #ff4444; color: #ff4444;">RESET LISTY</button>
    </div>

    <div class="main">
        <div class="panel">UCZESTNICY: <span id="count">0</span></div>
        <div id="participants-list"></div>
    </div>

    <div class="panel winners"><h3>ZWYCIĘZCY</h3></div>

    <script>
        const socket = io();
        const list = document.getElementById('participants-list');
        const countSpan = document.getElementById('count');

        socket.on('init', (data) => {
            list.innerHTML = "";
            data.participants.forEach(p => renderParticipant(p));
            updateCount();
        });

        socket.on('newParticipant', (sender) => {
            renderParticipant(sender);
            updateCount();
        });

        socket.on('participantsReset', () => {
            list.innerHTML = "";
            updateCount();
        });

        function renderParticipant(sender) {
            if (!document.getElementById('p-' + sender)) {
                const div = document.createElement('div');
                div.className = 'p-card';
                div.id = 'p-' + sender;
                div.innerText = sender;
                list.appendChild(div);
            }
        }

        function updateCount() {
            countSpan.innerText = list.children.length;
        }

        function updateKeyword() {
            socket.emit('updateKeyword', document.getElementById('keyword').value);
        }

        function reset() {
            socket.emit('reset');
        }
    </script>
</body>
</html>
