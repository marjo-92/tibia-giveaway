<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>KICK RAFFLE SYSTEM</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-main: #0b0c10;
            --bg-panel: #13151b;
            --bg-input: #1b1e25;
            --kick-green: #53fc18;
            --kick-green-hover: #45d612;
            --text-main: #eff1f5;
            --text-muted: #717684;
            --border-color: #21242c;
            --danger-red: #ea4335;
            --bg-main: #0c0814;
            --bg-panel: #160f24;
            --bg-input: #211633;
            --accent-glow: #b624ff;
            --accent-hover: #9f1be0;
            --text-main: #f1eef5;
            --text-muted: #8675a1;
            --border-panel: #2f1e47;
            --border-card: #3c265c;
            --danger-red: #e63946;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            gap: 20px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px 15px 10px;
        }
        .brand {
            color: var(--kick-green);
            font-weight: 800;
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .app-container {
            display: flex;
            flex: 1;
            gap: 15px;
            overflow: hidden;
        }

        /* WSPÓLNE STYLE DLA PANELU LEWEGO I PRAWEGO */
        .panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid var(--border-panel);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6);
        }

        .sidebar { width: 280px; }
        
        .tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 15px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .tab.active {
            color: var(--kick-green);
            border-bottom: 2px solid var(--kick-green);
            margin-bottom: -2px;
        .panel-title {
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 25px;
            color: var(--text-main);
            border-left: 3px solid var(--accent-glow);
            padding-left: 10px;
        }
        
        .section-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 15px;

        /* LEWA KOLUMNA - USTAWIENIA */
        .sidebar-left {
            width: 320px;
            min-width: 320px;
        }
        

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
            gap: 8px;
            margin-bottom: 20px;
        }

        .form-group label {
            font-size: 0.75rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .form-group label span {
            color: var(--accent-glow);
            float: right;
        }
        input {

        input[type="text"], input[type="number"] {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border: 1px solid var(--border-card);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
        }
        input:focus { border-color: var(--kick-green); }
        
        .btn-primary {
            background-color: var(--kick-green);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: var(--accent-glow);
            box-shadow: 0 0 8px rgba(182, 36, 255, 0.3);
        }

        /* Stylizacja suwaka (Slider) */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: var(--bg-input);
            height: 8px;
            border-radius: 4px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent-glow);
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 0 8px var(--accent-glow);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .btn-container-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 25px;
        }

        button {
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            margin-top: auto;
            transition: background 0.2s;
            font-size: 0.8rem;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        .btn-primary:hover { background-color: var(--kick-green-hover); }

        .btn-save {
            background-color: var(--accent-glow);
            color: #fff;
            box-shadow: 0 0 10px rgba(182, 36, 255, 0.4);
        }
        .btn-save:hover { background-color: var(--accent-hover); }

        .btn-reset {
            background-color: var(--danger-red);
            color: #fff;
        }
        .btn-reset:hover { filter: brightness(1.2); }

        .btn-action {
            background-color: transparent;
            border: 1px solid var(--border-card);
            color: var(--text-main);
            margin-top: 10px;
        }
        .btn-action:hover { 
            border-color: var(--accent-glow); 
            background-color: rgba(182, 36, 255, 0.05);
        }

        /* ŚRODKOWA KOLUMNA - ARENA NICKÓW */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .widgets-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .widget {

        .status-header {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid var(--border-panel);
            padding: 15px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            font-size: 0.9rem;
        }
        .status-lbl { color: var(--text-muted); text-transform: uppercase; font-size: 0.75rem; font-weight: 700;}
        .status-val { font-weight: 700; color: var(--accent-glow); }

        .arena-wrapper {
            flex: 1;
            background-color: rgba(0,0,0,0.2);
            border: 1px solid var(--border-panel);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .arena-title {
            text-align: center;
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }
        .widget-icon { font-size: 1.5rem; }
        .widget-info { display: flex; flex-direction: column; }
        .widget-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
        .widget-value { font-size: 1.1rem; font-weight: bold; }

        .arena {
            flex: 1;
            background-color: #0a0b0e;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            grid-auto-rows: max-content;
            gap: 10px;
            gap: 12px;
        }

        /* Wyśrodkowane nicki w ramkach */
        .p-card {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            background-color: var(--bg-panel);
            border: 1px solid var(--border-card);
            padding: 14px 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            word-break: break-all;
            transition: all 0.2s;
        }

        .bottom-actions { display: flex; gap: 10px; }
        .btn-secondary {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            transition: all 0.2s;
        /* PRAWA KOLUMNA - TABELA ZWYCIĘZCÓW */
        .sidebar-right {
            width: 320px;
            min-width: 320px;
        }
        .btn-secondary:hover { background-color: var(--border-color); }
        .btn-danger {
            background-color: rgba(234, 67, 53, 0.1);
            border: 1px solid var(--danger-red);
            color: var(--danger-red);

        .table-container {
            flex: 1;
            overflow-y: auto;
            background-color: var(--bg-input);
            border-radius: 8px;
            border: 1px solid var(--border-card);
        }
        .btn-danger:hover { background-color: rgba(234, 67, 53, 0.2); }

        .winners-sidebar { width: 240px; }
        .winners-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }
        .badge {
            background-color: var(--kick-green);
            color: #000;

        th {
            background-color: rgba(0,0,0,0.3);
            color: var(--text-muted);
            padding: 12px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            border-bottom: 1px solid var(--border-card);
        }
        .winners-list {
            flex: 1;
            background-color: #0a0b0e;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;

        td {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-weight: 600;
        }
        .w-card {
            background-color: rgba(83, 252, 24, 0.1);
            border: 1px solid var(--kick-green);
            color: var(--text-main);
            padding: 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            text-align: center;

        tr:last-child td { border: none; }
        
        .td-tc {
            text-align: right;
            color: var(--accent-glow);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="brand">Kick Raffle System</div>
    </div>

    <div class="app-container">
    <div class="panel sidebar-left">
        <div class="panel-title">Ustawienia Losowania</div>

        <div class="panel sidebar">
            <div class="tabs">
                <div class="tab active">RAFFLE</div>
                <div class="tab">KOŁO</div>
            </div>
            <div class="section-title">Ustawienia</div>
            
            <div class="form-group">
                <label>Słowo kluczowe:</label>
                <input id="keyword-input" placeholder="Wpisz hasło">
            </div>
            <button class="btn-secondary" onclick="saveKeyword()" style="margin-bottom: 15px;">ZAPISZ HASŁO</button>
            
            <div class="form-group">
                <label>Liczba zwycięzców:</label>
                <input type="number" id="winners-amount" value="1" min="1">
            </div>
        <div class="form-group">
            <label>Słowo kluczowe:</label>
            <input id="keyword-input" type="text" placeholder="Wpisz hasło...">
        </div>

            <button class="btn-primary" onclick="triggerStartFight()">Rozpocznij losowanie</button>
        <div class="form-group">
            <label>Ilość TC:</label>
            <input id="tc-input" type="number" value="50" placeholder="np. 50">
        </div>

        <div class="main-content">
            <div class="widgets-grid">
                <div class="widget">
                    <div class="widget-icon">🎁</div>
                    <div class="widget-info">
                        <span class="widget-label">Status</span>
                        <span class="widget-value" id="status-display">Oczekiwanie</span>
                    </div>
                </div>
                <div class="widget">
                    <div class="widget-icon">🔑</div>
                    <div class="widget-info">
                        <span class="widget-label">Hasło</span>
                        <span class="widget-value" id="password-display">-</span>
                    </div>
                </div>
                <div class="widget">
                    <div class="widget-icon">👥</div>
                    <div class="widget-info">
                        <span class="widget-label">Uczestników</span>
                        <span class="widget-value" id="count-display">0</span>
                    </div>
                </div>
            </div>
        <div class="form-group">
            <label>Ilość uczestników: <span id="slider-val">10</span></label>
            <input id="participant-slider" type="range" min="1" max="100" value="10" oninput="document.getElementById('slider-val').innerText = this.value">
        </div>

            <div class="arena" id="participants-grid"></div>
        <div class="btn-container-row">
            <button class="btn-save" onclick="saveKeyword()">Zapisz</button>
            <button class="btn-reset" onclick="triggerReset()">Reset</button>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-card); margin-bottom: 25px; width: 100%;">

            <div class="bottom-actions">
                <button class="btn-secondary" onclick="drawWinner()">Wylosuj zwycięzcę</button>
                <button class="btn-secondary" onclick="shuffleParticipants()">Przemieszaj</button>
                <button class="btn-secondary btn-danger" onclick="triggerReset()">Resetuj</button>
            </div>
        <button class="btn-save" style="width: 100%; padding: 15px; font-size: 0.9rem;" onclick="triggerStartFight()">Rozpocznij losowanie</button>
        <button class="btn-action" style="width: 100%;" onclick="drawWinner()">Wylosuj zwycięzcę</button>
        <button class="btn-action" style="width: 100%;" onclick="shuffleParticipants()">Przemieszaj</button>
    </div>

    <div class="main-content">
        <div class="status-header">
            <div><span class="status-lbl">Status:</span> <span id="status-display" class="status-val" style="color: #fff;">Oczekiwanie</span></div>
            <div><span class="status-lbl">Aktywne Hasło:</span> <span id="password-display" class="status-val">-</span></div>
            <div><span class="status-lbl">Dołączyło:</span> <span id="count-display" class="status-val">0</span></div>
        </div>

        <div class="panel winners-sidebar">
            <div class="winners-header">
                <div class="section-title" style="margin:0;">Zwycięzcy</div>
                <span class="badge" id="winners-count">0</span>
            </div>
            <div class="winners-list" id="winners-box"></div>
        <div class="arena-wrapper">
            <div class="arena-title">arena</div>
            <div class="arena" id="participants-grid"></div>
        </div>
    </div>

    <div class="panel sidebar-right">
        <div class="panel-title">Zwycięzcy</div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Nick</th>
                        <th style="text-align: right;">Nagroda</th>
                    </tr>
                </thead>
                <tbody id="winners-table-body">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        const socket = io();
        let localParticipants = [];
        let winnersList = [];

        const grid = document.getElementById('participants-grid');
        const countDisplay = document.getElementById('count-display');
        const passwordDisplay = document.getElementById('password-display');
        const statusDisplay = document.getElementById('status-display');
        const winnersBox = document.getElementById('winners-box');
        const winnersCountDisplay = document.getElementById('winners-count');
        const winnersTableBody = document.getElementById('winners-table-body');
        const keywordInput = document.getElementById('keyword-input');
        const tcInput = document.getElementById('tc-input');
        const participantSlider = document.getElementById('participant-slider');

        socket.on('init', (data) => {
            grid.innerHTML = "";
            localParticipants = data.participants || [];
            passwordDisplay.innerText = data.keyword ? data.keyword.toUpperCase() : "A";
            keywordInput.value = data.keyword || "a";
            localParticipants.forEach(p => renderParticipant(p));
            updateCounter();
        });

        socket.on('newParticipant', (sender) => {
            if (!localParticipants.includes(sender)) {
                localParticipants.push(sender);
                renderParticipant(sender);
                updateCounter();
            }
        });

        socket.on('keywordChanged', (kw) => {
            passwordDisplay.innerText = kw ? kw.toUpperCase() : "BRAK HASŁA";
            statusDisplay.innerText = "Hasło zaktualizowane";
        });

        socket.on('participantsReset', () => {
            grid.innerHTML = "";
            winnersBox.innerHTML = "";
            winnersTableBody.innerHTML = "";
            localParticipants = [];
            winnersList = [];
            winnersCountDisplay.innerText = "0";
            statusDisplay.innerText = "Zresetowano";
            statusDisplay.innerText = "Zresetowano system";
            updateCounter();
        });

        socket.on('triggerFight', () => {
            if (localParticipants.length === 0) {
                statusDisplay.innerText = "Brak graczy!";
            const requiredAmount = parseInt(participantSlider.value);
            
            if (localParticipants.length < requiredAmount) {
                statusDisplay.innerText = `Za mało osób! Wymagane: ${requiredAmount}`;
                return;
            }
            statusDisplay.innerText = "Losowanie...";

            // Efektowne automatyczne tasowanie przed wygraną
            statusDisplay.innerText = "Trwa losowanie...";
            
            let shuffles = 0;
            const interval = setInterval(() => {
                shuffleParticipants();
                shuffles++;
                if (shuffles >= 10) {
                    clearInterval(interval);
                    drawWinner();
                }
            }, 150);
        });

        function renderParticipant(sender) {
            if (!document.getElementById('p-' + sender)) {
                const div = document.createElement('div');
                div.className = 'p-card';
                div.id = 'p-' + sender;
                div.innerText = sender;
                grid.appendChild(div);
            }
        }

        function updateCounter() {
            countDisplay.innerText = localParticipants.length;
        }

        function saveKeyword() {
            const val = keywordInput.value;
            socket.emit('updateKeyword', val);
        }

        function triggerReset() {
            socket.emit('reset');
        }

        function triggerStartFight() {
            socket.emit('startFight');
        }

        function shuffleParticipants() {
            if (localParticipants.length < 2) return;

            // Algorytm Fisher-Yates do losowego mieszania tablicy
            for (let i = localParticipants.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [localParticipants[i], localParticipants[j]] = [localParticipants[j], localParticipants[i]];
            }

            grid.innerHTML = "";
            localParticipants.forEach(p => {
                renderParticipant(p);
                // Zachowaj podświetlenie jeśli już wygrał wcześniej
                if (winnersList.includes(p)) {
                    const card = document.getElementById('p-' + p);
                    if (card) {
                        card.style.backgroundColor = 'var(--kick-green)';
                        card.style.color = '#000';
                        card.style.borderColor = 'var(--accent-glow)';
                        card.style.backgroundColor = 'rgba(182, 36, 255, 0.15)';
                        card.style.color = 'var(--accent-glow)';
                        card.style.boxShadow = '0 0 12px rgba(182, 36, 255, 0.4)';
                    }
                }
            });
        }

        function drawWinner() {
            // Filtrujemy tylko tych, którzy jeszcze nie wygrali
            const available = localParticipants.filter(p => !winnersList.includes(p));

            if (available.length === 0) {
                statusDisplay.innerText = "Brak kandydatów!";
                statusDisplay.innerText = "Brak wolnych uczestników!";
                return;
            }

            const randomIndex = Math.floor(Math.random() * available.length);
            const winner = available[randomIndex];

            winnersList.push(winner);
            const tcValue = tcInput.value || "0";

            // Dodaj do listy zwycięzców po prawej stronie
            const wCard = document.createElement('div');
            wCard.className = 'w-card';
            wCard.innerText = `🏆 ${winner}`;
            winnersBox.appendChild(wCard);
            // Dodanie wiersza (Tylko Nick i Nagroda - bez kolumny miejsca)
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${winner}</td>
                <td class="td-tc">${tcValue} TC</td>
            `;
            winnersTableBody.appendChild(tr);

            // Podświetlenie kafelka na arenie na zielono Kicka
            // Podświetlenie neonowym fioletem na arenie
            const card = document.getElementById('p-' + winner);
            if (card) {
                card.style.backgroundColor = 'var(--kick-green)';
                card.style.color = '#000';
                card.style.transform = 'scale(1.05)';
                card.style.borderColor = 'var(--accent-glow)';
                card.style.backgroundColor = 'rgba(182, 36, 255, 0.2)';
                card.style.color = 'var(--accent-glow)';
                card.style.boxShadow = '0 0 15px rgba(182, 36, 255, 0.6)';
            }

            winnersCountDisplay.innerText = winnersList.length;
            statusDisplay.innerText = `Wygrał: ${winner}`;
            statusDisplay.innerText = `Wygrywa: ${winner}!`;
        }
    </script>
</body>
</html>
