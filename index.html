<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>KICK RAFFLE SYSTEM</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* Główne style - bardzo ciemne tło */
        body { background: #121417; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; padding: 15px; gap: 15px; }
        .panel { background: #1c1f23; border: 1px solid #333; border-radius: 8px; padding: 15px; }
        
        /* Lewy panel (Ustawienia) */
        .sidebar { width: 300px; display: flex; flex-direction: column; gap: 10px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
        input { background: #23272c; border: 1px solid #444; color: white; padding: 8px; border-radius: 4px; }
        .btn-start { background: #00ff00; color: #000; font-weight: bold; padding: 15px; border: none; border-radius: 4px; cursor: pointer; }
        
        /* Środek */
        .main { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .header-bar { display: flex; justify-content: space-between; background: #1c1f23; padding: 20px; border-radius: 8px; border: 1px solid #333; }
        .participants-area { flex: 1; background: #16181c; border: 1px solid #333; border-radius: 8px; overflow-y: auto; padding: 10px; }
        
        /* Prawy */
        .winners-panel { width: 250px; display: flex; flex-direction: column; }
        .winners-list { flex: 1; background: #16181c; border-radius: 8px; border: 1px solid #333; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="panel sidebar">
        <h3>Ustawienia</h3>
        <div class="input-group">
            <label>Słowo kluczowe:</label>
            <input id="keyword" placeholder="Np. a">
        </div>
        <button class="btn-start" onclick="updateKeyword()">ZAPISZ HASŁO</button>
        <button class="btn-start" style="background:#ff4444;" onclick="reset()">RESETUJ</button>
    </div>

    <div class="main">
        <div class="header-bar">
            <div>LOSOWANIE: <span id="raffle-status">-</span></div>
            <div>HASŁO: <span id="current-pass">a</span></div>
            <div>UCZESTNICY: <span id="count">0</span></div>
        </div>
        <div class="participants-area" id="participants-list"></div>
    </div>

    <div class="panel winners-panel">
        <h3>Zwycięzcy</h3>
        <div class="winners-list" id="winners-list"></div>
    </div>

    <script>
        const socket = io();
        socket.on('init', (data) => {
            document.getElementById('current-pass').innerText = data.keyword;
            document.getElementById('count').innerText = data.participants.length;
            data.participants.forEach(p => addParticipant(p));
        });

        socket.on('newParticipant', (sender) => {
            addParticipant(sender);
            updateCount();
        });

        function addParticipant(sender) {
            const div = document.createElement('div');
            div.style.padding = "5px";
            div.innerText = sender;
            document.getElementById('participants-list').appendChild(div);
        }

        function updateCount() {
            document.getElementById('count').innerText = document.getElementById('participants-list').children.length;
        }

        function updateKeyword() {
            const kw = document.getElementById('keyword').value;
            socket.emit('updateKeyword', kw);
            document.getElementById('current-pass').innerText = kw;
        }

        function reset() {
            socket.emit('reset');
            document.getElementById('participants-list').innerHTML = "";
            updateCount();
        }
    </script>
</body>
</html>
