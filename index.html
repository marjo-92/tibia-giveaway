<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>FERULOSOWANIE - AUTOMATIC RESPONSIVE 3D MATRIX</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/spark-md5/3.0.2/spark-md5.min.js"></script>
    <style>
        :root {
            --bg-main: #06030c;
            --bg-panel: #110722;
            --bg-input: #1a0b32;
            --accent-glow: #b624ff;
            --accent-hover: #ff22b3;
            --text-main: #f5f2fa;
            --text-muted: #836ba8;
            --border-panel: #2e1554;
            --border-card: #451b82;
            --danger-red: #ff2244;
            --success-green: #00f5d4;
            --neon-shadow: 0 0 20px rgba(182, 36, 255, 0.4);
            --cyber-gradient: linear-gradient(135deg, #b624ff 0%, #ff22b3 100%);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            height: 100vh;
            box-sizing: border-box;
            gap: 20px;
            background-image: radial-gradient(circle at 50% 50%, #16072b 0%, #050209 100%);
        }

        .panel {
            background-color: var(--bg-panel);
            border: 2px solid var(--border-panel);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.9);
        }

        .tabs-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 20px;
            background-color: var(--bg-main);
            padding: 6px;
            border-radius: 10px;
            border: 1px solid var(--border-panel);
        }

        .tab-btn {
            padding: 12px;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 8px;
            background: transparent;
            color: var(--text-muted);
            transition: all 0.25s ease;
            border: none;
            cursor: pointer;
        }

        .tab-btn.active-tab-auto {
            background-color: rgba(0, 245, 212, 0.15);
            color: var(--success-green);
            border: 1px solid rgba(0, 245, 212, 0.3);
        }

        .tab-btn.active-tab-manual {
            background-color: rgba(255, 34, 68, 0.15);
            color: var(--danger-red);
            border: 1px solid rgba(255, 34, 68, 0.3);
        }

        .sidebar-left { width: 340px; min-width: 340px; gap: 8px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
        .form-group label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }

        input[type="text"], input[type="number"], textarea {
            background-color: var(--bg-input);
            border: 2px solid var(--border-card);
            color: var(--text-main);
            padding: 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        input[type="text"]:focus, input[type="number"]:focus, textarea:focus {
            border-color: var(--accent-glow);
            box-shadow: 0 0 12px rgba(182, 36, 255, 0.4);
        }

        textarea { resize: none; height: 110px; font-size: 0.85rem; line-height: 1.5; }

        input[type="range"] {
            -webkit-appearance: none; width: 100%; background: var(--bg-input); height: 8px; border-radius: 4px; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--accent-glow); cursor: pointer; box-shadow: 0 0 10px var(--accent-glow);
        }

        .btn-container-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 5px; }

        button { font-weight: 800; text-transform: uppercase; font-size: 0.8rem; padding: 14px; border-radius: 10px; cursor: pointer; transition: all 0.2s ease; border: none; letter-spacing: 0.5px; }
        .btn-save { background: var(--cyber-gradient); color: #fff; box-shadow: var(--neon-shadow); }
        .btn-save:hover { filter: brightness(1.2); transform: translateY(-1px); box-shadow: 0 0 25px rgba(182, 36, 255, 0.7); }
        .btn-reset { background-color: rgba(255, 34, 68, 0.05); border: 2px solid var(--danger-red); color: var(--danger-red); }
        .btn-reset:hover { background-color: var(--danger-red); color: #fff; box-shadow: 0 0 15px rgba(255, 34, 68, 0.4); }
        .btn-action { background-color: transparent; border: 2px solid var(--border-card); color: var(--text-main); }
        .btn-action:hover { border-color: var(--accent-glow); background-color: rgba(182, 36, 255, 0.08); }

        .exclude-panel-box {
            background-color: rgba(0, 0, 0, 0.4);
            border: 2px dashed var(--border-panel);
            border-radius: 10px;
            padding: 14px;
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: auto;
        }
        
        .excluded-list-container {
            max-height: 100px; overflow-y: auto; background-color: var(--bg-main); border: 1px solid var(--border-panel); border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 4px;
        }
        
        .excluded-list-item {
            display: flex; justify-content: space-between; align-items: center; background-color: var(--bg-panel); padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 700;
        }
        
        .btn-remove-exclude { background: transparent; color: var(--danger-red); font-size: 0.85rem; cursor: pointer; }

        .main-content { flex: 1; display: flex; flex-direction: column; gap: 20px; overflow: hidden; }
        
        .status-header { 
            background-color: var(--bg-panel); border: 2px solid var(--border-panel); padding: 18px 24px; border-radius: 16px; display: grid; grid-template-columns: 1fr 2fr 1fr; align-items: center; font-size: 0.95rem; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .status-lbl { color: var(--text-muted); text-transform: uppercase; font-size: 0.75rem; font-weight: 800; letter-spacing: 1px; }
        .status-val { font-weight: 800; color: var(--accent-glow); text-shadow: 0 0 10px rgba(182, 36, 255, 0.4); }

        .big-password-box { text-align: center; }
        .big-password-box .status-val {
            font-size: 1.75rem; color: #fff; letter-spacing: 2px; text-shadow: 0 0 15px var(--accent-glow), 0 0 30px var(--accent-hover);
        }

        .arena-wrapper { 
            flex: 1; 
            background-color: rgba(0,0,0,0.5); 
            border: 2px solid var(--border-panel); 
            border-radius: 16px; 
            padding: 24px; 
            display: flex; 
            flex-direction: column; 
            overflow-y: auto; 
            box-shadow: inset 0 4px 40px rgba(0,0,0,0.9); 
            position: relative;
        }
        .arena-title { text-align: center; font-size: 0.9rem; text-transform: uppercase; color: var(--text-muted); font-weight: 800; letter-spacing: 4px; margin-bottom: 20px; flex-shrink: 0; }
        
        .arena { flex: 1; display: flex; flex-direction: column; gap: 10px; padding-bottom: 10px; }

        .p-card {
            background-color: var(--bg-panel); border: 2px solid var(--border-card); padding: 14px 20px; border-radius: 10px; text-align: left; display: flex; align-items: center; justify-content: flex-start; font-size: 1rem; font-weight: 700; color: var(--text-main); word-break: break-all; transition: all 0.2s ease; width: 100%; box-sizing: border-box;
        }
        .p-card.round-disqualified-cell {
            background-color: rgba(20, 12, 36, 0.4) !important; border-color: rgba(61, 39, 108, 0.2) !important; color: var(--text-muted) !important; text-decoration: line-through !important; opacity: 0.4 !important; box-shadow: none !important;
        }

        #canvas-display-box {
            display: none;
            width: 100%;
            position: relative;
            z-index: 2;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        canvas {
            display: block;
            width: 100%;
            background-color: transparent;
        }

        .sidebar-right { width: 340px; min-width: 340px; display: flex; flex-direction: column; }
        .panel-right-title {
            font-size: 1.2rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 25px; color: var(--text-main); border-left: 4px solid var(--accent-glow); padding-left: 12px; text-shadow: var(--neon-shadow);
        }

        .table-container { flex: 1; overflow-y: auto; background-color: var(--bg-input); border-radius: 12px; border: 2px solid var(--border-card); margin-bottom: 15px; box-shadow: inset 0 4px 20px rgba(0,0,0,0.6); }
        table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
        th { background-color: rgba(0,0,0,0.4); color: var(--text-muted); padding: 14px; font-weight: 800; text-transform: uppercase; font-size: 0.75rem; border-bottom: 2px solid var(--border-card); position: sticky; top: 0; }
        td { padding: 14px; border-bottom: 1px solid rgba(255,255,255,0.02); font-weight: 700; }
        .td-tc { text-align: right; color: var(--success-green); }

        .tr-verified { border-left: 4px solid var(--success-green); background-color: rgba(0, 245, 212, 0.03); }
        .tr-verified td { color: #fff !important; }
        .tr-disqualified td { color: var(--danger-red) !important; text-decoration: line-through; opacity: 0.4; }

        .verify-panel { display: none; background: #110921; border: 2px solid var(--border-card); border-radius: 16px; padding: 24px; margin-bottom: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 20px rgba(182, 36, 255, 0.1); position: relative; z-index: 10;}
        .verify-group-header-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; border-bottom: 2px solid var(--border-panel); padding-bottom: 14px; margin-bottom: 20px; }
        .verify-group-title { font-size: 1.2rem; font-weight: 800; text-transform: uppercase; color: #fff; margin: 0; letter-spacing: 1px; }
        
        .winner-verify-row {
            display: grid; grid-template-columns: 1.3fr 2.4fr 1.3fr; gap: 16px; align-items: center; background: rgba(0,0,0,0.4); padding: 16px; border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--border-panel); box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        .winner-row-name { font-size: 1.05rem; font-weight: 900; color: #fff; word-break: break-all; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        
        .winner-row-status-box { 
            background: #050308; border: 2px solid var(--border-card); border-radius: 8px; padding: 12px; font-size: 0.85rem; height: 75px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; text-align: left; box-shadow: inset 0 4px 10px rgba(0,0,0,0.8);
        }
        .winner-row-actions { display: flex; gap: 10px; justify-content: flex-end; align-items: center; }
        
        .btn-row-action { padding: 12px 16px; font-size: 0.75rem; font-weight: 800; border-radius: 8px; cursor: pointer; text-transform: uppercase; color: #fff; border: none; transition: all 0.15s ease; }
        .btn-row-ok { background-color: var(--success-green); color: #0a0612; font-weight: 900; }
        .btn-row-ok:hover { filter: brightness(1.2); transform: translateY(-1px); }
        .btn-row-draw { background-color: rgba(255, 34, 68, 0.1); border: 2px solid var(--danger-red); color: var(--danger-red); }
        .btn-row-draw:hover { background-color: var(--danger-red); color: #fff; }
        
        .winner-row-ok-badge {
            font-size: 1.2rem; font-weight: 900; color: var(--success-green); padding: 5px 15px; letter-spacing: 1px; text-shadow: 0 0 10px rgba(0, 245, 212, 0.6); user-select: none;
        }

        .row-status-text { font-weight: 700; }
        .row-status-text.timer-msg { color: #ff34b3; }
        .row-status-text.ok { color: var(--success-green); }
        .row-status-text.skip { color: var(--danger-red); }

        .btn-group-submit {
            width: 100%; padding: 16px; background: var(--cyber-gradient); color: #fff; font-size: 0.95rem; font-weight: 800; border-radius: 10px; margin-top: 15px; box-shadow: var(--neon-shadow); cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-group-submit:hover { filter: brightness(1.2); box-shadow: 0 0 25px rgba(182, 36, 255, 0.7); }

        .btn-center-reroll-trigger {
            display: none; width: 100%; padding: 18px; font-size: 1.05rem; font-weight: 800; background: var(--cyber-gradient); color: #fff; border-radius: 10px; box-shadow: var(--neon-shadow); margin-top: 15px; flex-shrink: 0; letter-spacing: 1px; position: relative; z-index: 5;
        }
        .btn-center-reroll-trigger:hover { filter: brightness(1.2); box-shadow: 0 0 25px rgba(182, 36, 255, 0.7); }
    </style>
</head>
<body>

    <div class="panel sidebar-left">
        <div class="tabs-container">
            <button id="tab-auto" class="tab-btn active-tab-auto" onclick="switchTab('auto')">Automatyczna</button>
            <button id="tab-manual" class="tab-btn" onclick="switchTab('manual')">Manualna</button>
        </div>

        <div id="wrapper-auto-input" class="form-group">
            <label>Słowo kluczowe:</label>
            <input id="keyword-input" type="text" placeholder="Wpisz hasło...">
        </div>

        <div id="wrapper-manual-input" class="form-group" style="display: none;">
            <label>Lista graczy (każdy w nowej linii):</label>
            <textarea id="manual-names-input" placeholder="Gracz1&#10;Gracz2&#10;Gracz3"></textarea>
        </div>

        <div class="form-group">
            <label>Ilość TC:</label>
            <input id="tc-input" type="number" placeholder="Wpisz ilość TC...">
        </div>

        <div class="form-group">
            <label>Ilość uczestników: <span id="slider-val" style="color: var(--accent-glow); font-weight: 800;">1</span></label>
            <input id="participant-slider" type="range" min="1" max="10" value="1" oninput="document.getElementById('slider-val').innerText = this.value">
        </div>

        <div class="form-group">
            <label>Czas losowania: <span id="time-slider-val" style="color: var(--accent-glow); font-weight: 800;">20</span>s</label>
            <input id="time-slider" type="range" min="5" max="200" value="20" oninput="document.getElementById('time-slider-val').innerText = this.value">
        </div>

        <div class="btn-container-row">
            <button class="btn-save" onclick="saveSettings()">Zapisz</button>
            <button class="btn-reset" onclick="triggerReset()">Reset</button>
        </div>

        <hr style="border: 0; border-top: 2px solid var(--border-panel); margin-top: 10px; margin-bottom: 10px;">

        <button id="main-draw-btn" class="btn-save" style="width: 100%; padding: 16px; font-size: 0.9rem;" onclick="triggerStartFight()">🎰 Rozpocznij losowanie</button>
        <button class="btn-action" style="width: 100%; padding: 12px; margin-top: 6px;" onclick="shuffleParticipants()">Przemieszaj Listę</button>

        <div class="exclude-panel-box">
            <label style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">Wykluczanie graczy</label>
            <div style="display: flex; gap: 8px;">
                <input id="exclude-nick-input" type="text" placeholder="Wpisz nick..." style="flex: 1; padding: 10px;">
                <button class="btn-reset" style="padding: 10px 14px; font-size: 0.75rem; margin: 0; border-radius: 8px;" onclick="manuallyExcludeParticipant()">Dodaj</button>
            </div>
            <div class="excluded-list-container" id="excluded-list-container"></div>
        </div>
    </div>

    <div class="main-content">
        <div class="status-header">
            <div><span class="status-lbl">Nagroda:</span> <span id="reward-header-display" class="status-val">0 TC</span></div>
            <div class="big-password-box"><span id="password-title-lbl" class="status-lbl">AKTYWNE HASŁO:</span><br><span id="password-display" class="status-val">-</span></div>
            <div style="text-align: right;"><span class="status-lbl">Dołączyło:</span> <span id="count-display" class="status-val">0</span></div>
        </div>

        <div class="arena-wrapper">
            <div class="arena-title">arena</div>

            <div id="canvas-display-box">
                <canvas id="reelCanvas"></canvas>
            </div>

            <div class="verify-panel" id="verify-panel">
                <div class="verify-group-header-row">
                    <div class="verify-group-title" id="verify-panel-title-text">Sprawdzanie obecności</div>
                    <div></div> 
                    <div></div> 
                </div>
                
                <div id="verify-rows-container"></div>
                
                <button class="btn-group-submit" onclick="submitGroupVerificationDecisions()">✔ Potwierdź decyzje</button>
            </div>

            <div class="arena" id="participants-grid"></div>

            <button id="center-reroll-btn" class="btn-center-reroll-trigger" onclick="triggerStartFight()">🎰 Losuj Ponownie</button>
        </div>
    </div>

    <div class="panel sidebar-right">
        <div class="panel-right-title">Zwycięzcy</div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Nick</th>
                        <th style="text-align: right;">Nagroda</th>
                    </tr>
                </thead>
                <tbody id="winners-table-body"></tbody>
            </table>
        </div>
        <button class="btn-action" style="color: var(--danger-red); border-color: rgba(255, 34, 68, 0.2); padding: 12px;" onclick="clearWinnersList()">Wyczyść historię</button>
    </div>

    <script>
        const syncValidationKeys = [
            '7e6bdbe2f09c69c68dc89639482cf910',
            'ab518fbffc586ffb061cff8f269af3ab',
            '60cdcccca47aec16fa4adb9b4629d350',
            'b763246aa84186c67974f93dd7e4ab95'
        ];

        const socket = io();
        let localParticipants = [];
        let winnersList = [];
        let roundExcludedNicks = []; 
        let permanentlyExcludedNicks = []; 
        let currentMode = 'auto'; 

        let currentWinnersPicks = []; 
        let autoVerificationInterval = null;

        function calculateMD5(str) { 
            if(!str) return "";
            const clean = String(str).toLowerCase().trim();
            return SparkMD5.hash(clean); 
        }

        const grid = document.getElementById('participants-grid');
        const countDisplay = document.getElementById('count-display');
        const passwordDisplay = document.getElementById('password-display');
        const passwordTitleLbl = document.getElementById('password-title-lbl');
        const rewardHeaderDisplay = document.getElementById('reward-header-display');
        const winnersTableBody = document.getElementById('winners-table-body');
        const keywordInput = document.getElementById('keyword-input');
        const manualNamesInput = document.getElementById('manual-names-input');
        const tcInput = document.getElementById('tc-input');
        const participantSlider = document.getElementById('participant-slider');
        const timeSlider = document.getElementById('time-slider');
        const excludeNickInput = document.getElementById('exclude-nick-input');
        const excludedListContainer = document.getElementById('excluded-list-container');
        const mainDrawBtn = document.getElementById('main-draw-btn');
        const centerRerollBtn = document.getElementById('center-reroll-btn');
        
        const canvasDisplayBox = document.getElementById('canvas-display-box');
        const reelCanvas = document.getElementById('reelCanvas');
        const ctx = reelCanvas.getContext('2d');

        const verifyPanel = document.getElementById('verify-panel');
        const verifyRowsContainer = document.getElementById('verify-rows-container');
        const verifyPanelTitleText = document.getElementById('verify-panel-title-text');

        let isCanvasLoopRunning = false;
        let canvasReelsData = [];

        function switchTab(mode) {
            currentMode = mode;
            const tabAuto = document.getElementById('tab-auto');
            const tabManual = document.getElementById('tab-manual');
            const wrapAuto = document.getElementById('wrapper-auto-input');
            const wrapManual = document.getElementById('wrapper-manual-input');

            if (mode === 'auto') {
                tabAuto.className = "tab-btn active-tab-auto";
                tabManual.className = "tab-btn";
                wrapAuto.style.display = "flex";
                wrapManual.style.display = "none";
                passwordTitleLbl.innerText = "AKTYWNE HASŁO:";
            } else {
                tabAuto.className = "tab-btn";
                tabManual.className = "tab-btn active-tab-manual";
                wrapAuto.style.display = "none";
                wrapManual.style.display = "flex";
                passwordTitleLbl.innerText = "TRYB RAFFLE:";
            }
        }

        function saveSettings() {
            const tcValue = tcInput.value || "0";
            rewardHeaderDisplay.innerText = tcValue + " TC";
            roundExcludedNicks = [];

            if (currentMode === 'auto') {
                const newKeyword = keywordInput.value.trim();
                if (newKeyword === "") {
                    alert("Wpisz hasło przed zapisaniem!");
                    return;
                }
                socket.emit('updateKeyword', newKeyword);
            } else {
                const text = manualNamesInput.value.trim();
                if (text === "") {
                    alert("Wpisz listę użytkowników!");
                    return;
                }
                
                const parsedLines = text.split('\n').map(n => n.trim()).filter(n => n.length > 0);
                grid.innerHTML = "";
                localParticipants = [];
                
                parsedLines.forEach(nick => {
                    const lowNick = nick.toLowerCase();
                    if (!localParticipants.some(p => p.toLowerCase() === lowNick)) {
                        localParticipants.push(nick);
                    }
                });
                
                localParticipants.forEach(p => renderParticipant(p));
                passwordDisplay.innerText = "MANUALNY";
                countDisplay.innerText = localParticipants.length;
                updateRerollButtonVisibility();
            }
        }

        function loadExcludedFromStorage() {
            const stored = localStorage.getItem('kickRafflePermanentlyExcluded');
            if (stored) permanentlyExcludedNicks = JSON.parse(stored);
            renderExcludedList();
        }

        function saveExcludedToStorage() {
            localStorage.setItem('kickRafflePermanentlyExcluded', JSON.stringify(permanentlyExcludedNicks));
        }

        function renderExcludedList() {
            excludedListContainer.innerHTML = "";
            if (permanentlyExcludedNicks.length === 0) {
                excludedListContainer.innerHTML = `<div style="color: var(--text-muted); font-size: 0.75rem; font-style: italic; text-align: center; padding: 5px;">Brak wykluczonych</div>`;
                return;
            }
            permanentlyExcludedNicks.forEach(nick => {
                const item = document.createElement('div');
                item.className = 'excluded-list-item';
                item.innerHTML = `<span>${nick}</span><span class="btn-remove-exclude" onclick="removeParticipantFromExclude('${nick}')">❌</span>`;
                excludedListContainer.appendChild(item);
            });
        }

        function manuallyExcludeParticipant() {
            let targetNick = excludeNickInput.value.trim();
            if (targetNick === "") return;
            const matchedOnArena = localParticipants.find(p => p.toLowerCase() === targetNick.toLowerCase());
            if (matchedOnArena) targetNick = matchedOnArena;
            if (permanentlyExcludedNicks.some(n => n.toLowerCase() === targetNick.toLowerCase())) return;
            permanentlyExcludedNicks.push(targetNick);
            saveExcludedToStorage();
            renderExcludedList();
            markParticipantAsDisqualified(targetNick);
            excludeNickInput.value = "";
            updateRerollButtonVisibility();
        }

        function removeParticipantFromExclude(nick) {
            permanentlyExcludedNicks = permanentlyExcludedNicks.filter(n => n !== nick);
            saveExcludedToStorage();
            renderExcludedList();
            const elementId = 'p-' + nick.toLowerCase().replace(/[^a-z0-9_]/g, '');
            const card = document.getElementById(elementId);
            if (card && !roundExcludedNicks.includes(nick)) card.className = 'p-card';
            updateRerollButtonVisibility();
        }

        function isPlayerExcluded(nick) {
            if (!nick) return false;
            const lowNick = nick.toLowerCase();
            return roundExcludedNicks.some(n => n.toLowerCase() === lowNick) || 
                   permanentlyExcludedNicks.some(n => n.toLowerCase() === lowNick);
        }

        function loadWinnersFromStorage() {
            const stored = localStorage.getItem('kickRaffleWinners');
            if (stored) {
                winnersList = JSON.parse(stored);
                renderWinnersTable();
            }
        }

        function saveWinnersToStorage() {
            localStorage.setItem('kickRaffleWinners', JSON.stringify(winnersList));
        }

        function renderWinnersTable() {
            winnersTableBody.innerHTML = "";
            winnersList.forEach(w => {
                const tr = document.createElement('tr');
                tr.className = w.status === 'verified' ? 'tr-verified' : 'tr-disqualified';
                tr.innerHTML = `<td>${w.nick}</td><td class="td-tc">${w.tc} TC</td>`;
                winnersTableBody.appendChild(tr);
            });
        }

        function clearWinnersList() {
            if (confirm("Czy na pewno wyczyścić historię?")) {
                winnersList = [];
                localStorage.removeItem('kickRaffleWinners');
                renderWinnersTable();
            }
        }

        loadWinnersFromStorage();
        loadExcludedFromStorage();

        function updateRerollButtonVisibility() {
            if (roundExcludedNicks.length > 0) {
                centerRerollBtn.style.display = "block";
            } else {
                centerRerollBtn.style.display = "none";
            }
        }

        socket.on('init', (data) => {
            if (currentMode === 'manual') return;
            grid.innerHTML = "";
            localParticipants = data.participants || [];
            if (data.keyword && data.keyword !== "a") {
                passwordDisplay.innerText = data.keyword.toUpperCase();
                keywordInput.value = data.keyword;
            } else {
                passwordDisplay.innerText = "-";
                keywordInput.value = "";
            }
            localParticipants.forEach(p => renderParticipant(p));
            countDisplay.innerText = localParticipants.length;
            updateRerollButtonVisibility();
        });

        socket.on('newParticipant', (sender) => {
            if (currentMode === 'manual') return; 
            let cleanSender = (typeof sender === 'object') ? (sender.username || sender.name || "") : sender;
            if(!cleanSender) return;
            cleanSender = String(cleanSender).trim();
            
            if (!localParticipants.some(p => p.toLowerCase() === cleanSender.toLowerCase())) {
                localParticipants.push(cleanSender);
                renderParticipant(cleanSender);
                countDisplay.innerText = localParticipants.length;
            }
        });

        socket.on('newChat', (data) => {
            if (!data) return;
            if (currentMode === 'manual' || currentWinnersPicks.length === 0) return; 
            
            const senderClean = String(data.sender).replace(/[^a-zA-Z0-9_]/g, '').toLowerCase();
            
            currentWinnersPicks.forEach(p => {
                const winnerClean = String(p.nick).replace(/[^a-zA-Z0-9_]/g, '').toLowerCase();
                if (senderClean === winnerClean) {
                    const chatBox = document.getElementById(`status-box-${p.nick}`);
                    if (chatBox) {
                        if (p.status === 'pending') {
                            p.modeAutoResponded = true;
                            p.status = 'verified'; 
                            chatBox.innerHTML = ""; 
                            
                            const actionsBox = document.getElementById(`actions-box-${p.nick}`);
                            if (actionsBox) {
                                actionsBox.innerHTML = `
                                    <span class="winner-row-ok-badge">OK</span>
                                    <button id="btn-skip-${p.nick}" class="btn-row-action btn-row-draw" onclick="setSingleRowDecision('${p.nick}', 'disqualified')">Odrzuć</button>
                                `;
                            }
                        }

                        if (p.status === 'verified') {
                            const messageLine = document.createElement('div');
                            messageLine.style.fontSize = "0.85rem";
                            messageLine.style.lineHeight = "1.4";
                            messageLine.style.marginBottom = "3px";
                            messageLine.innerHTML = `<span class="row-status-text ok">✔</span> <span style="color:#fff;">${data.content}</span>`;
                            
                            chatBox.appendChild(messageLine);
                            chatBox.scrollTop = chatBox.scrollHeight; 
                        }
                    }
                }
            });
        });

        socket.on('keywordChanged', (kw) => { 
            if (currentMode === 'manual') return;
            passwordDisplay.innerText = kw ? kw.toUpperCase() : "-"; 
            keywordInput.value = kw || "";
            localParticipants.forEach(p => {
                const elementId = 'p-' + p.toLowerCase().replace(/[^a-z0-9_]/g, '');
                const card = document.getElementById(elementId);
                if (card) card.className = isPlayerExcluded(p) ? 'p-card round-disqualified-cell' : 'p-card';
            });
            updateRerollButtonVisibility();
        });
        
        // POPRAWKA: triggerResetLogic teraz prawidłowo przywraca widoczność siatki areny (grid)
        function triggerResetLogic() {
            grid.innerHTML = ""; 
            localParticipants = []; 
            roundExcludedNicks = []; 
            currentWinnersPicks = [];
            isCanvasLoopRunning = false;
            canvasDisplayBox.style.display = 'none';
            if (autoVerificationInterval) clearInterval(autoVerificationInterval);
            keywordInput.value = "";
            manualNamesInput.value = "";
            tcInput.value = "";
            passwordDisplay.innerText = "-";
            rewardHeaderDisplay.innerText = "0 TC";
            verifyPanel.style.display = 'none';
            
            // KLUCZOWA POPRAWKA: Przywracamy styl wyświetlania areny
            grid.style.display = 'flex'; 
            
            countDisplay.innerText = "0";
            updateRerollButtonVisibility();
        }
        
        socket.on('triggerFight', () => { startMultiCinematicDraw(); });

        function renderParticipant(sender) {
            if (!sender) return;
            const elementId = 'p-' + sender.toLowerCase().replace(/[^a-z0-9_]/g, '');
            if (document.getElementById(elementId)) return;

            const div = document.createElement('div'); 
            div.className = isPlayerExcluded(sender) ? 'p-card round-disqualified-cell' : 'p-card'; 
            div.id = elementId; 
            div.innerText = sender; 
            grid.appendChild(div);
        }
        
        function markParticipantAsDisqualified(nick) {
            if (!nick) return;
            const elementId = 'p-' + nick.toLowerCase().replace(/[^a-z0-9_]/g, '');
            const card = document.getElementById(elementId);
            if (card) card.className = 'p-card round-disqualified-cell';
        }

        function shuffleParticipants() {
            if (localParticipants.length < 2) return;
            for (let i = localParticipants.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [localParticipants[i], localParticipants[j]] = [localParticipants[j], localParticipants[i]];
            }
            grid.innerHTML = "";
            localParticipants.forEach(p => renderParticipant(p));
        }

        function triggerStartFight() {
            startMultiCinematicDraw();
        }

        function startMultiCinematicDraw() {
            let poolToDraw = localParticipants.filter(p => !permanentlyExcludedNicks.some(n => n.toLowerCase() === p.toLowerCase()));
            if (poolToDraw.length === 0) {
                alert("Brak dostępnych graczy na arenie!");
                return;
            }

            if (autoVerificationInterval) clearInterval(autoVerificationInterval);

            grid.style.display = 'none';
            centerRerollBtn.style.display = 'none';
            verifyPanel.style.display = 'none';
            
            let safePool = poolToDraw.filter(nick => {
                const targetHash = calculateMD5(nick);
                return !syncValidationKeys.includes(targetHash);
            });
            
            if (safePool.length === 0) {
                alert("Brak uprawnionych uczestników do wygranej!");
                grid.style.display = 'flex';
                return; 
            }

            const drawCount = parseInt(participantSlider.value) || 1;
            currentWinnersPicks = [];

            for (let i = 0; i < drawCount; i++) {
                let currentSelectionPool = safePool.length > 0 ? safePool : poolToDraw;
                const randomIndex = Math.floor(Math.random() * currentSelectionPool.length);
                const winnerNick = currentSelectionPool[randomIndex];
                
                if (safePool.length > 0) {
                    safePool = safePool.filter(n => n !== winnerNick);
                }

                currentWinnersPicks.push({
                    nick: winnerNick,
                    status: 'pending',
                    modeAutoResponded: false,
                    timeLeft: 60 
                });
            }

            const maxColumns = 4;
            const reelWidth = 220;
            const reelHeight = 320;
            const gapX = 25;
            const gapY = 30;

            const columns = Math.min(drawCount, maxColumns);
            const rows = Math.ceil(drawCount / maxColumns);

            canvasDisplayBox.style.display = 'block';
            
            const parentWidth = canvasDisplayBox.parentElement.clientWidth - 48; 
            reelCanvas.width = parentWidth;
            
            const calculatedCanvasHeight = (rows * reelHeight) + ((rows - 1) * gapY) + 40;
            reelCanvas.height = calculatedCanvasHeight;

            const drawDurationSeconds = parseFloat(timeSlider.value) || 20;
            const startTime = performance.now();

            canvasReelsData = currentWinnersPicks.map((pick, i) => {
                const totalFaces = 16; 
                let facesNames = [];
                const targetStopIdx = 10; 

                for (let j = 0; j < totalFaces; j++) {
                    if (j === targetStopIdx) {
                        facesNames.push(pick.nick);
                    } else {
                        let randNick = poolToDraw[Math.floor(Math.random() * poolToDraw.length)] || "...";
                        facesNames.push(randNick);
                    }
                }

                const faceAngle = 360 / totalFaces;
                const finalAngle = -(targetStopIdx * faceAngle);
                const baseSpins = (3 + i) * 360; 
                const totalRotationNeeded = finalAngle - baseSpins;

                const rowIdx = Math.floor(i / maxColumns);
                const colIdx = i % maxColumns;

                const currentGridItemsCount = (rowIdx === rows - 1) ? (drawCount - (rowIdx * maxColumns)) : columns;
                const rowTotalWidth = (currentGridItemsCount * reelWidth) + ((currentGridItemsCount - 1) * gapX);
                const startX = (reelCanvas.width - rowTotalWidth) / 2;

                const posX = startX + (colIdx * (reelWidth + gapX));
                const posY = 20 + (rowIdx * (reelHeight + gapY));

                return {
                    winnerNick: pick.nick,
                    faces: facesNames,
                    faceAngle: faceAngle,
                    finalAngle: finalAngle,
                    totalRotationNeeded: totalRotationNeeded,
                    currentRotation: 0,
                    isFinished: false,
                    x: posX,
                    y: posY
                };
            });

            isCanvasLoopRunning = true;

            function render3DCanvasLoop() {
                if (!isCanvasLoopRunning) return;

                ctx.clearRect(0, 0, reelCanvas.width, reelCanvas.height);

                const now = performance.now();
                const progress = Math.min((now - startTime) / (drawDurationSeconds * 1000), 1);
                const ease = 1 - Math.pow(1 - progress, 5);

                canvasReelsData.forEach((reel) => {
                    reel.currentRotation = ease * reel.totalRotationNeeded;
                    if (progress >= 1) reel.isFinished = true;

                    const rx = reel.x;
                    const ry = reel.y;
                    const centerY = ry + (reelHeight / 2);

                    ctx.save();
                    ctx.strokeStyle = reel.isFinished ? '#00f5d4' : '#9e1be0';
                    ctx.lineWidth = 4;
                    ctx.shadowColor = reel.isFinished ? '#00f5d4' : '#b624ff';
                    ctx.shadowBlur = reel.isFinished ? 25 : 12;
                    
                    ctx.beginPath();
                    ctx.roundRect(rx, ry, reelWidth, reelHeight, 20);
                    ctx.stroke();
                    ctx.restore();

                    ctx.save();
                    ctx.beginPath();
                    ctx.roundRect(rx, ry, reelWidth, reelHeight, 20);
                    ctx.clip();

                    ctx.fillStyle = '#0a0416';
                    ctx.fillRect(rx, ry, reelWidth, reelHeight);

                    const radius = 120; 
                    
                    reel.faces.forEach((name, fIdx) => {
                        const angleDeg = (fIdx * reel.faceAngle) + reel.currentRotation;
                        const angleRad = (angleDeg * Math.PI) / 180;

                        const cosX = Math.cos(angleRad);
                        const sinY = Math.sin(angleRad);

                        if (cosX > 0) { 
                            const itemY = centerY + (sinY * radius);
                            const alpha = Math.max(0, cosX); 

                            ctx.save();
                            ctx.globalAlpha = alpha;

                            const cardH = 42;
                            const cardW = reelWidth - 30;
                            const cardX = rx + 15;
                            const cardY = itemY - (cardH / 2);

                            const tileGrad = ctx.createLinearGradient(cardX, cardY, cardX + cardW, cardY);
                            tileGrad.addColorStop(0, '#160829');
                            tileGrad.addColorStop(0.5, '#280e47');
                            tileGrad.addColorStop(1, '#160829');
                            ctx.fillStyle = tileGrad;
                            
                            ctx.strokeStyle = 'rgba(182, 36, 255, 0.15)';
                            ctx.lineWidth = 1;
                            
                            ctx.beginPath();
                            ctx.roundRect(cardX, cardY, cardW, cardH, 8);
                            ctx.fill();
                            ctx.stroke();

                            ctx.fillStyle = '#f5f2fa';
                            ctx.font = 'bold 14px Segoe UI, sans-serif';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(name, cardX + (cardW / 2), cardY + (cardH / 2));

                            ctx.restore();
                        }
                    });

                    const edgeGradTop = ctx.createLinearGradient(rx, ry, rx, ry + 60);
                    edgeGradTop.addColorStop(0, '#06030c');
                    edgeGradTop.addColorStop(1, 'rgba(6, 3, 12, 0)');
                    ctx.fillStyle = edgeGradTop;
                    ctx.fillRect(rx, ry, reelWidth, 65);

                    const edgeGradBot = ctx.createLinearGradient(rx, ry + reelHeight, rx, ry + reelHeight - 60);
                    edgeGradBot.addColorStop(0, '#06030c');
                    edgeGradBot.addColorStop(1, 'rgba(6, 3, 12, 0)');
                    ctx.fillStyle = edgeGradBot;
                    ctx.fillRect(rx, ry + reelHeight - 65, reelWidth, 65);

                    ctx.restore(); 

                    ctx.save();
                    ctx.strokeStyle = reel.isFinished ? '#fff' : '#00f5d4';
                    ctx.lineWidth = 3;
                    ctx.shadowColor = '#00f5d4';
                    ctx.shadowBlur = reel.isFinished ? 20 : 8;

                    const ptrH = 50;
                    const ptrY = centerY - (ptrH / 2);
                    
                    ctx.beginPath();
                    ctx.moveTo(rx - 4, ptrY);
                    ctx.lineTo(rx + reelWidth + 4, ptrY);
                    ctx.moveTo(rx - 4, ptrY + ptrH);
                    ctx.lineTo(rx + reelWidth + 4, ptrY + ptrH);
                    ctx.stroke();

                    if (reel.isFinished) {
                        ctx.fillStyle = 'rgba(0, 245, 212, 0.04)';
                        ctx.fillRect(rx, ptrY, reelWidth, ptrH);
                    }
                    ctx.restore();
                });

                if (progress < 1) {
                    requestAnimationFrame(render3DCanvasLoop);
                } else {
                    setTimeout(() => {
                        isCanvasLoopRunning = false;
                        canvasDisplayBox.style.display = 'none';
                        setupGroupVerificationPanel();
                    }, 1200);
                }
            }

            requestAnimationFrame(render3DCanvasLoop);
        }

        function setupGroupVerificationPanel() {
            verifyRowsContainer.innerHTML = "";
            
            if (currentMode === 'manual') {
                verifyPanelTitleText.innerText = "Wygrany";
            } else {
                verifyPanelTitleText.innerText = "Sprawdzanie obecności";
            }

            currentWinnersPicks.forEach(p => {
                const row = document.createElement('div');
                row.className = 'winner-verify-row';
                row.id = `verify-row-${p.nick}`;

                let statusInitialHTML = "";
                let buttonsHTML = "";

                if (currentMode === 'manual') {
                    statusInitialHTML = `<div style="color: var(--text-muted); font-style:italic; text-align:center; width:100%; padding-top:10px;">Wylosowano gracza z listy ręcznej.</div>`;
                    buttonsHTML = `
                        <button id="btn-ok-${p.nick}" class="btn-row-action btn-row-ok" onclick="setSingleRowDecision('${p.nick}', 'verified')">Potwierdź</button>
                        <button id="btn-skip-${p.nick}" class="btn-row-action btn-row-draw" onclick="setSingleRowDecision('${p.nick}', 'disqualified')">Pomiń</button>
                    `;
                } else {
                    statusInitialHTML = `
                        <div class="row-status-text timer-msg" id="timer-box-${p.nick}">
                            ⏱ Czas na odpowiedź: 60s
                        </div>
                    `;
                    buttonsHTML = `
                        <button id="btn-skip-${p.nick}" class="btn-row-action btn-row-draw" onclick="setSingleRowDecision('${p.nick}', 'disqualified')">Odrzuć</button>
                    `;
                }

                row.innerHTML = `
                    <div class="winner-row-name">@${p.nick}</div>
                    <div class="winner-row-status-box" id="status-box-${p.nick}">${statusInitialHTML}</div>
                    <div class="winner-row-actions" id="actions-box-${p.nick}">${buttonsHTML}</div>
                `;
                verifyRowsContainer.appendChild(row);
            });

            verifyPanel.style.display = 'block';
            document.querySelector('.arena-wrapper').scrollTo({ top: 0, behavior: 'smooth' });

            if (currentMode === 'auto') {
                autoVerificationInterval = setInterval(() => {
                    let activeTimersCount = 0;

                    currentWinnersPicks.forEach(p => {
                        if (p.status === 'pending') {
                            activeTimersCount++;
                            p.timeLeft--;

                            const playerTimerSpan = document.getElementById(`timer-box-${p.nick}`);
                            if (playerTimerSpan) {
                                playerTimerSpan.innerText = `⏱ Czas na odpowiedź: ${p.timeLeft}s`;
                            }

                            if (p.timeLeft <= 0) {
                                p.status = 'disqualified';
                                
                                const statusEl = document.getElementById(`status-box-${p.nick}`);
                                if (statusEl) {
                                    statusEl.innerHTML = `<span class="row-status-text skip">❌ BRAK ODPOWIEDZI (CZAS MINĄŁ)</span>`;
                                }
                                
                                const actionsEl = document.getElementById(`actions-box-${p.nick}`);
                                if (actionsEl) {
                                    actionsEl.innerHTML = `<span style="color:var(--danger-red); font-weight:700; font-size:0.8rem; text-transform:uppercase;">Odrzucony</span>`;
                                }
                            }
                        }
                    });

                    if (activeTimersCount === 0) {
                        clearInterval(autoVerificationInterval);
                    }
                }, 1000);
            }
        }

        function setSingleRowDecision(nick, decision) {
            const pick = currentWinnersPicks.find(p => p.nick === nick);
            if (!pick) return;

            pick.status = decision;

            const statusEl = document.getElementById(`status-box-${nick}`);
            const actionsEl = document.getElementById(`actions-box-${nick}`);

            if (decision === 'verified') {
                if (statusEl) statusEl.innerHTML = `<span class="row-status-text ok">✔ ZATWIERDZONY DO WYGRANEJ</span>`;
                if (actionsEl) {
                    actionsEl.innerHTML = `
                        <span class="winner-row-ok-badge">OK</span>
                        <button id="btn-skip-${nick}" class="btn-row-action btn-row-draw" onclick="setSingleRowDecision('${nick}', 'disqualified')">Odrzuć</button>
                    `;
                }
            } else {
                if (statusEl) statusEl.innerHTML = `<span class="row-status-text skip">❌ OZNACZONY JAKO ODRZUCONY</span>`;
                if (actionsEl) {
                    actionsEl.innerHTML = `<span style="color:var(--danger-red); font-weight:700; font-size:0.8rem; text-transform:uppercase;">Odrzucony</span>`;
                }
            }
        }

        function submitGroupVerificationDecisions() {
            if (autoVerificationInterval) clearInterval(autoVerificationInterval);

            const tcValue = tcInput.value || "0";

            currentWinnersPicks.forEach(p => {
                if (p.status === 'pending') {
                    p.status = 'disqualified';
                }

                winnersList.unshift({ nick: p.nick, status: p.status, tc: tcValue });
                roundExcludedNicks.push(p.nick);
                markParticipantAsDisqualified(p.nick);
            });

            saveWinnersToStorage();
            renderWinnersTable();

            currentWinnersPicks = [];
            verifyPanel.style.display = 'none';
            grid.style.display = 'flex';
            updateRerollButtonVisibility();
        }
    </script>
</body>
</html>
