<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>KICK RAFFLE SYSTEM</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-main: #0b0c10;
            --bg-panel: #13151b;
            --bg-input: #1b1e25;
            --kick-green: #53fc18;
            --kick-green-hover: #45d612;
            --text-main: #eff1f5;
            --text-muted: #717684;
            --border-color: #21242c;
            --danger-red: #ea4335;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px 15px 10px;
        }
        .brand {
            color: var(--kick-green);
            font-weight: 800;
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .app-container {
            display: flex;
            flex: 1;
            gap: 15px;
            overflow: hidden;
        }

        .panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar { width: 280px; }
        
        .tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 15px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .tab.active {
            color: var(--kick-green);
            border-bottom: 2px solid var(--kick-green);
            margin-bottom: -2px;
        }
        
        .section-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }
        .form-group label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        input {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        
        .btn-primary {
            background-color: var(--kick-green);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.85rem;
            margin-top: auto;
        }
        .btn-primary:hover { background-color: var(--kick-green-hover); }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .widgets-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .widget {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .widget-icon { font-size: 1.5rem; }
        .widget-info { display: flex; flex-direction: column; }
        .widget-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
        .widget-value { font-size: 1.1rem; font-weight: bold; }

        .arena {
            flex: 1;
            background-color: #0a0b0e;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            grid-auto-rows: max-content;
            gap: 10px;
        }
        .p-card {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .bottom-actions { display: flex; gap: 10px; }
        .btn-secondary {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .btn-danger {
            background-color: rgba(234, 67, 53, 0.1);
            border: 1px solid var(--danger-red);
            color: var(--danger-red);
        }

        .winners-sidebar { width: 240px; }
        .winners-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .badge {
            background-color: var(--kick-green);
            color: #000;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
        }
        .winners-list {
            flex: 1;
            background-color: #0a0b0e;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="brand">Kick Raffle System</div>
    </div>

    <div class="app-container">
        
        <div class="panel sidebar">
            <div class="tabs">
                <div class="tab active">RAFFLE</div>
                <div class="tab">KOŁO</div>
            </div>
            <div class="section-title">Ustawienia</div>
            
            <div class="form-group">
                <label>Słowo kluczowe:</label>
                <input id="keyword-input" placeholder="Wpisz hasło">
            </div>
            <button class="btn-secondary" onclick="saveKeyword()" style="margin-bottom: 15px;">ZAPISZ HASŁO</button>
            
            <div class="form-group">
                <label>Liczba zwycięzców:</label>
                <input type="number" value="1" min="1">
            </div>

            <button class="btn-primary" onclick="triggerStartFight()">Rozpocznij losowanie</button>
        </div>

        <div class="main-content">
            <div class="widgets-grid">
                <div class="widget">
                    <div class="widget-icon">🎁</div>
                    <div class="widget-info">
                        <span class="widget-label">Losowanie</span>
                        <span class="widget-value" id="status-display">-</span>
                    </div>
                </div>
                <div class="widget">
                    <div class="widget-icon">🔑</div>
                    <div class="widget-info">
                        <span class="widget-label">Hasło</span>
                        <span class="widget-value" id="password-display">A</span>
                    </div>
                </div>
                <div class="widget">
                    <div class="widget-icon">👥</div>
                    <div class="widget-info">
                        <span class="widget-label">Uczestników</span>
                        <span class="widget-value" id="count-display">0</span>
                    </div>
                </div>
            </div>

            <div class="arena" id="participants-grid"></div>

            <div class="bottom-actions">
                <button class="btn-secondary">Wylosuj zwycięzcę</button>
                <button class="btn-secondary">Przemieszaj</button>
                <button class="btn-secondary btn-danger" onclick="triggerReset()">Resetuj</button>
            </div>
        </div>

        <div class="panel winners-sidebar">
            <div class="winners-header">
                <div class="section-title" style="margin:0;">Zwycięzcy</div>
                <span class="badge" id="winners-count">0</span>
            </div>
            <div class="winners-list" id="winners-box"></div>
        </div>

    </div>

    <script>
        const socket = io();
        const grid = document.getElementById('participants-grid');
        const countDisplay = document.getElementById('count-display');
        const passwordDisplay = document.getElementById('password-display');

        socket.on('init', (data) => {
            grid.innerHTML = "";
            passwordDisplay.innerText = data.keyword ? data.keyword.toUpperCase() : "A";
            document.getElementById('keyword-input').value = data.keyword;
            data.participants.forEach(p => renderParticipant(p));
            updateCounter();
        });

        socket.on('newParticipant', (sender) => {
            renderParticipant(sender);
            updateCounter();
        });

        socket.on('keywordChanged', (kw) => {
            passwordDisplay.innerText = kw ? kw.toUpperCase() : "BRAK HASŁA";
        });

        socket.on('participantsReset', () => {
            grid.innerHTML = "";
            updateCounter();
        });

        function renderParticipant(sender) {
            if (!document.getElementById('p-' + sender)) {
                const div = document.createElement('div');
                div.className = 'p-card';
                div.id = 'p-' + sender;
                div.innerText = sender;
                grid.appendChild(div);
            }
        }

        function updateCounter() {
            countDisplay.innerText = grid.children.length;
        }

        function saveKeyword() {
            const val = document.getElementById('keyword-input').value;
            socket.emit('updateKeyword', val);
        }

        function triggerReset() {
            socket.emit('reset');
        }

        function triggerStartFight() {
            socket.emit('startFight');
        }
    </script>
</body>
</html>
