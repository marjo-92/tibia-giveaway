<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --accent: #00ff41; --bg: #0f1115; --panel: #1a1d23; }
        body { background: var(--bg); color: #fff; font-family: 'Roboto', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; padding: 20px; box-sizing: border-box; }

        /* Główne panele z efektem szkła */
        .panel { background: var(--panel); border: 1px solid #333; border-radius: 12px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }

        .sidebar { width: 320px; display: flex; flex-direction: column; gap: 20px; }
        .main { flex: 1; margin: 0 20px; display: flex; flex-direction: column; gap: 20px; }
        .winners { width: 300px; }

        h2, h3 { font-family: 'Orbitron', sans-serif; color: var(--accent); letter-spacing: 2px; }

        input { background: #262a33; border: 1px solid #444; color: white; padding: 12px; border-radius: 6px; width: 100%; box-sizing: border-box; }
        
        button { background: transparent; border: 2px solid var(--accent); color: var(--accent); padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        button:hover { background: var(--accent); color: #000; }
        button.primary { background: var(--accent); color: #000; }

        .stats-bar { display: flex; justify-content: space-between; background: #262a33; padding: 15px; border-radius: 8px; border-left: 4px solid var(--accent); }
        
        #participants-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; padding: 10px; }
        .p-card { background: #262a33; padding: 8px; border-radius: 4px; text-align: center; font-size: 0.9em; border: 1px solid #444; }
    </style>
</head>
<body>

    <div class="panel sidebar">
        <h2>USTAWIENIA</h2>
        <input id="keyword" placeholder="SŁOWO KLUCZOWE">
        <button onclick="updateKeyword()">ZAPISZ HASŁO</button>
        <button onclick="reset()" style="border-color: #ff4444; color: #ff4444;">RESET LISTY</button>
        <hr style="width: 100%; border: 0; border-top: 1px solid #333;">
        <button class="primary" onclick="startFight()">ROZPOCZNIJ WALKĘ</button>
    </div>

    <div class="main">
        <div class="stats-bar">
            <div>STATUS: <span id="status">CZEKAM...</span></div>
            <div>HASŁO: <span id="current-pass">a</span></div>
            <div>UCZESTNICY: <span id="count">0</span></div>
        </div>
        <div class="panel" id="participants-list" style="flex: 1; overflow-y: auto;"></div>
        <div id="game-container" style="display:none; width: 100%; height: 100%;"></div>
    </div>

    <div class="panel winners">
        <h3>ZWYCIĘZCY</h3>
        <div id="winners-list"></div>
    </div>

    <script>
        const socket = io();
        // ... (Logika Socket.io taka sama jak poprzednio)
        function startFight() {
            socket.emit('startFight');
            document.getElementById('participants-list').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            // Tutaj w przyszłości zainicjujemy Phasera
        }
    </script>
</body>
</html>
