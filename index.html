<<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Tibia Ferumbras Raid Lottery</title>
    <style>
        body {
            background-color: #0d0f12; color: #d1d5db; font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; user-select: none;
        }
        h1 { color: #ff3333; text-shadow: 0 0 10px rgba(255,51,51,0.4); margin-bottom: 5px; }
        #controls { margin: 15px; display: flex; gap: 10px; align-items: center; }
        button {
            background: #1f2937; color: white; border: 2px solid #374151;
            padding: 10px 25px; font-size: 16px; font-weight: bold; cursor: pointer;
        }
        button:hover { background: #ff3333; color: white; border-color: #ff3333; }
        #gameCanvas { background-color: #404040; border: 4px solid #1a1a1a; box-shadow: 0 10px 25px rgba(0,0,0,0.7); image-rendering: pixelated; }
        #lootMessage { margin-top: 15px; font-size: 18px; color: #00e701; min-height: 50px; font-weight: bold; text-align: center; line-height: 1.5; }
        .info { color: #888; font-size: 12px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h1>FERUMBRAS RAID</h1>
    <div class="info">Lista widzów wczytana z kodu gry. Kliknij przycisk, aby rozpocząć rzeź!</div>

    <div id="controls">
        <button onclick="startBossFight()" style="background: #990000; border-color: #cc0000; color: white;">ODPAL RAJD!</button>
    </div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div id="lootMessage"></div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // 📝 TUTAJ WPISZ NICKI SWOICH WIDZÓW NA SZTYWNO:
        let viewerNames = ["Widz1", "Widz2", "Widz3", "Mod_Tomek", "Kamil99", "TibiaFan", "Krecik", "Gamer3000", "StreamViewer"];

        let players = [];
        let boss = { x: 400, y: 250, hp: 1000, maxHp: 1000, size: 36, isDead: false, name: "Ferumbras" };
        let damageTexts = [];
        let visualEffects = [];
        let gameActive = false;
        let killTimer = 0;
        let killInterval = 60;

        class Player {
            constructor(name) {
                this.name = name;
                this.x = Math.random() > 0.5 ? Math.random() * 120 : 680 + Math.random() * 120;
                this.y = Math.random() > 0.5 ? Math.random() * 120 : 380 + Math.random() * 120;
                this.color = ["#ff5555", "#55ff55", "#5555ff", "#ffff55", "#ff55ff", "#55ffff"][Math.floor(Math.random() * 6)];
                this.speed = 1.8 + Math.random() * 1.2;
                this.isDead = false;
            }
            update() {
                if (this.isDead || boss.isDead) return;
                let dx = boss.x - this.x;
                let dy = boss.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > 50) {
                    this.x += (dx / distance) * this.speed;
                    this.y += (dy / distance) * this.speed;
                } else if (gameActive) {
                    this.x += (Math.random() * 2 - 1);
                    this.y += (Math.random() * 2 - 1);
                    if (Math.random() < 0.08) {
                        let dmg = Math.floor(Math.random() * 80) + 20;
                        damageTexts.push({ x: boss.x + (Math.random()*40-20), y: boss.y - 35, text: `-${dmg}`, color: "#ff0000", timer: 25 });
                    }
                }
            }
            draw() {
                if (this.isDead) return;
                ctx.fillStyle = this.color; ctx.fillRect(this.x - 12, this.y - 12, 24, 24);
                ctx.fillStyle = "#ffdbac"; ctx.fillRect(this.x - 6, this.y - 22, 12, 12);
                ctx.fillStyle = "#ffffff"; ctx.font = "bold 11px monospace"; ctx.textAlign = "center";
                ctx.fillText(this.name, this.x, this.y - 28);
            }
        }

        // Automatyczne dodawanie osób wpisanych na sztywno zaraz po odpaleniu strony
        function initPlayers() {
            players = [];
            viewerNames.forEach(name => {
                players.push(new Player(name));
            });
        }

        function startBossFight() {
            initPlayers(); // Odradzamy wszystkich na start walki
            let alivePlayers = players.filter(p => !p.isDead);
            if (alivePlayers.length === 0) return alert("Brak graczy na liście kodu!");
            
            boss.hp = boss.maxHp; boss.isDead = false;
            document.getElementById("lootMessage").innerText = "Ferumbras: The world will tremble before my power!";
            killInterval = Math.max(15, Math.floor(300 / alivePlayers.length)); 
            killTimer = 0; gameActive = true;
        }

        function executeRandomPlayer() {
            let alivePlayers = players.filter(p => !p.isDead);
            if (alivePlayers.length === 1) {
                let winner = alivePlayers[0];
                boss.hp = 0; boss.isDead = true; gameActive = false;
                damageTexts.push({ x: boss.x, y: boss.y, text: "-9999!!!", color: "#ffff00", timer: 60 });
                document.getElementById("lootMessage").innerHTML = `
                    <span style="color: #ffaa00;">Ferumbras dies.</span><br>
                    Loot of Ferumbras: You see a <span style="color:#ff55ff;">Ferumbras' Hat</span>. It belongs to ${winner.name}!
                `;
                return;
            }
            if (alivePlayers.length > 1) {
                let victim = alivePlayers[Math.floor(Math.random() * alivePlayers.length)];
                victim.isDead = true;
                damageTexts.push({ x: victim.x, y: victim.y - 15, text: "-DEAD", color: "#ff3333", timer: 40 });
                visualEffects.push({ x: victim.x, y: victim.y, radius: 5, maxRadius: 20, color: "rgba(200,200,200,0.6)", timer: 15 });
                visualEffects.push({ type: 'beam', x1: boss.x, y1: boss.y, x2: victim.x, y2: victim.y, timer: 10 });
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#4d4d4d"; ctx.lineWidth = 1;
            for(let x=0; x<canvas.width; x+=32) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
            for(let y=0; y<canvas.height; y+=32) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

            if (gameActive && !boss.isDead) {
                killTimer++;
                if (killTimer >= killInterval) { executeRandomPlayer(); killTimer = 0; }
                let aliveCount = players.filter(p => !p.isDead).length;
                if (boss.hp > 10 && aliveCount > 1) boss.hp -= 0.5;
            }

            if (!boss.isDead) {
                ctx.fillStyle = "#7a0099"; ctx.fillRect(boss.x - boss.size/2, boss.y - boss.size/2, boss.size, boss.size);
                ctx.fillStyle = "#ffaa00"; ctx.fillRect(boss.x - 10, boss.y - boss.size/2 - 8, 20, 8);
                ctx.fillStyle = "#ff3333"; ctx.font = "bold 14px monospace"; ctx.textAlign = "center"; ctx.fillText(boss.name, boss.x, boss.y - 42);
                let barWidth = 70; let hpPercent = Math.max(0, boss.hp / boss.maxHp);
                ctx.fillStyle = "#000000"; ctx.fillRect(boss.x - barWidth/2, boss.y - 34, barWidth, 6);
                ctx.fillStyle = hpPercent > 0.25 ? "#00ff00" : "#ff0000"; ctx.fillRect(boss.x - barWidth/2, boss.y - 34, barWidth * hpPercent, 6);
            } else {
                ctx.fillStyle = "#4a005c"; ctx.fillRect(boss.x - 18, boss.y - 8, 36, 16);
            }

            players.forEach(p => { p.update(); p.draw(); });

            for (let i = visualEffects.length - 1; i >= 0; i--) {
                let fx = visualEffects[i];
                if (fx.type === 'beam') {
                    ctx.strokeStyle = "#ff3333"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(fx.x1, fx.y1); ctx.lineTo(fx.x2, fx.y2); ctx.stroke();
                } else {
                    ctx.strokeStyle = fx.color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(fx.x, fx.y, fx.radius, 0, Math.PI * 2); ctx.stroke();
                    fx.radius += (fx.maxRadius - fx.radius) * 0.2;
                }
                fx.timer--; if (fx.timer <= 0) visualEffects.splice(i, 1);
            }

            for (let i = damageTexts.length - 1; i >= 0; i--) {
                let dt = damageTexts[i]; ctx.fillStyle = dt.color; ctx.font = "bold 15px monospace"; ctx.textAlign = "center";
                ctx.fillText(dt.text, dt.x, dt.y); dt.y -= 0.6; dt.timer--; if (dt.timer <= 0) damageTexts.splice(i, 1);
            }
            requestAnimationFrame(gameLoop);
        }

        // Pierwsze załadowanie postaci na mapę
        initPlayers();
        gameLoop();
    </script>
</body>
</html>
